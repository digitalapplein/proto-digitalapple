<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Content at Scale for JLL</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px/1.5 system-ui,sans-serif;color:#333;background:#fff;padding:24px;box-sizing:border-box;text-align:center}</style>
</head>
<body>
<p id="msg">Loading…</p>
<script>
(async () => {
  const say = t => { document.getElementById("msg").textContent = t; };
  const k = new URLSearchParams(location.search).get("k");
  if (!k) return say("Open the link you were sent to view this presentation.");
  let page;
  try {
    const res = await fetch("deck.bin?v=78736a35e39703a9f4fe90b7");
    if (!res.ok) return say("The presentation could not load. Please refresh.");
    const data = new Uint8Array(await res.arrayBuffer());
    const raw = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(k));
    const aes = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    try { page = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: data.slice(0, 12) }, aes, data.slice(12))); }
    catch (e) { return say("This link is not complete. Open the full link you were sent."); }
  } catch (e) { return say("The presentation could not load. Please refresh."); }
  document.open(); document.write(page); document.close();
})();
</script>
</body>
</html>
