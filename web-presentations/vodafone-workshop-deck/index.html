<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-enabled portfolio marketing team</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
@font-face{font-family:'VodafoneDemo';src:url(assets/fonts/Vodafone_Rg.ttf) format('truetype');font-weight:400}
@font-face{font-family:'VodafoneDemo';src:url(assets/fonts/Vodafone_Bd.ttf) format('truetype');font-weight:700}
:root{
  --ink:#141413; --white:#FFFFFF; --g50:#F8F8F8; --g100:#E9E9E9; --g300:#CFCFCF; --g500:#B8B8B8; --g800:#656565;
  --gr100:#ECFFE8; --gr200:#D8FFD1; --gr500:#9EFF8C; --gr800:#527E49;
  --co100:#FFE2DB; --co500:#FF704A; --co700:#954731;
  --ease-out:cubic-bezier(0.23,1,0.32,1); --ease-io:cubic-bezier(0.77,0,0.175,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#E4E4E2;font-family:"Rethink Sans",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
::selection{background:var(--gr200);color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gr800);outline-offset:2px;border-radius:4px}

/* stage */
#viewport{position:fixed;inset:0;overflow:hidden}
#stage{width:1600px;height:900px;position:absolute;left:50%;top:50%;background:var(--white);transform-origin:center;overflow:hidden;box-shadow:0 2px 24px rgba(20,20,19,.08)}
.view{position:absolute;inset:0;padding:72px 88px 96px;opacity:0;visibility:hidden;transition:opacity 260ms var(--ease-out),visibility 0s 260ms}
.view.on{opacity:1;visibility:visible;transition:opacity 260ms var(--ease-out),visibility 0s}
.view.dark{background:var(--ink);color:var(--white)}
.view.soft{background:var(--g50)}

/* entrance */
.in{opacity:0;transform:translateY(10px)}
.view.on .in{animation:rise 420ms var(--ease-out) forwards;animation-delay:calc(var(--i,0) * 45ms + 60ms)}
@keyframes rise{to{opacity:1;transform:none}}

/* type */
.statement{font-size:76px;line-height:82px;font-weight:800;letter-spacing:-0.02em;max-width:1200px}
.title{font-size:64px;line-height:70px;font-weight:800;letter-spacing:-0.02em}
.lead{font-size:24px;line-height:34px;color:var(--g800);margin-top:14px;max-width:1100px}
.dark .lead{color:#C9C9C6}
.body{font-size:20px;line-height:30px}
.label{font-size:14px;line-height:20px;font-weight:500;color:var(--g800)}
.small{font-size:13px;line-height:18px;color:var(--g800)}
.num{font-variant-numeric:tabular-nums}
.rule{height:1px;background:var(--g300)}
.i{width:24px;height:24px;flex:none}


/* cover: sonar dot field, after 21st.dev SonarGrid */
.view.cover{padding:72px 88px 96px;cursor:crosshair}
#sonar{position:absolute;inset:0;width:100%;height:100%}
.cv-wash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 40% 34% at 50% 52%,var(--ink) 35%,rgba(20,20,19,0) 100%),radial-gradient(ellipse 260px 120px at 175px 102px,var(--ink) 55%,rgba(20,20,19,0) 100%),radial-gradient(ellipse 280px 120px at 1405px 102px,var(--ink) 55%,rgba(20,20,19,0) 100%)}
.cv-top{position:relative;display:flex;align-items:center;justify-content:space-between}
.cv-top .vf{height:44px}
.cv-top .da{height:22px;filter:invert(1)}
.cv-main{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center}
.cv-main .statement{margin:0 auto}.cv-main .lead{margin:20px auto 0}
#chrome.onCover .small,#chrome.onCover img{visibility:hidden}



/* agenda: white, big heading, timed list */
.view.agenda .statement{font-size:88px;line-height:92px}
.ag-goal{font-size:26px;line-height:36px;font-weight:500;margin-top:20px;max-width:1100px}
.ag-list{margin-top:44px;border-top:1px solid var(--g300)}
.ag-row{display:grid;grid-template-columns:130px 330px 1fr;align-items:baseline;padding:20px 0;border-bottom:1px solid var(--g300)}
.ag-row .t{font-size:28px;font-weight:700;letter-spacing:-0.01em}
.ag-row .h{font-size:26px;font-weight:700}
.ag-row .d{font-size:20px;line-height:28px;max-width:900px}

/* expectations: coloured question boxes with live notes (brand "Color in use") */
.view.expect{display:grid;grid-template-rows:auto 1fr;row-gap:32px}
.ex-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:20px;min-height:0}
.ex-box{border-radius:10px;padding:32px 36px;display:flex;flex-direction:column;gap:14px;min-height:0}
.ex-box.g{background:var(--gr500)}
.ex-box.c{background:var(--co500)}
.ex-box.l{background:var(--g100)}
.ex-box.d{background:var(--ink);color:#fff}
.ex-box .q{font-size:34px;line-height:40px;font-weight:700;letter-spacing:-0.02em;max-width:640px}
.ex-box .note{flex:1;overflow:auto;font-size:20px;line-height:29px;outline:none;cursor:text;white-space:pre-line}
.ex-box .note:empty::before{content:attr(data-ph);opacity:.6}
.ex-box .note:focus-visible{outline:none}
.ex-box:focus-within{box-shadow:inset 0 0 0 2px var(--ink)}
.ex-box.d:focus-within{box-shadow:inset 0 0 0 2px var(--gr500)}
/* demos: rows left, chat building a Vodafone template right */
.view.demos{display:grid;grid-template-columns:620px 1fr;column-gap:56px}
.dm-left .lead{font-size:22px;line-height:30px;color:var(--ink)}
.dm-rows{margin-top:48px;border-top:1px solid var(--g300)}
.dm-row{width:100%;display:grid;grid-template-columns:40px 1fr;align-items:center;column-gap:14px;text-align:left;padding:24px 18px;margin:0 -18px;border-bottom:1px solid var(--g300);border-radius:10px;transition:background 200ms ease,transform 120ms var(--ease-out)}
.dm-row:active{transform:scale(.98)}

.dm-row .nm{font-size:28px;line-height:34px;font-weight:700;letter-spacing:-0.01em}
.dm-row[aria-pressed="true"]{background:var(--gr500);border-color:transparent}
@media (hover:hover) and (pointer:fine){.dm-row[aria-pressed="false"]:hover{background:var(--g50)}}
.dm-stage{background:var(--g50);border-radius:14px;padding:38px 32px;display:flex;flex-direction:row;align-items:flex-start;justify-content:center;gap:24px;height:732px}
.dm-top{width:200px;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:12px;padding-top:6px}
.dm-msg{background:var(--ink);color:#fff;font-size:17px;line-height:23px;padding:11px 16px;border-radius:16px 16px 4px 16px;opacity:0;transform:translateY(6px);transition:opacity 220ms var(--ease-out),transform 220ms var(--ease-out)}
.dm-msg.on{opacity:1;transform:none}
.dm-msg .cur{display:inline-block;width:2px;height:18px;background:var(--gr500);vertical-align:-3px;margin-left:2px}
.dm-status{order:1;display:flex;align-items:center;gap:8px;font-size:16px;font-weight:500;opacity:0;transition:opacity 220ms ease}
.dm-status.on{opacity:1}
.dm-status .i{width:18px;height:18px}
.dm-status .spin{animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* the brochure: Vodafone Business one-pager, built to the Clearview Vodafone Business kit (v2): official photo, Living Speechmark, white logo, fonts */
.dm-page{flex:none;width:462px;height:653px;background:#fff;font-family:'VodafoneDemo',sans-serif;color:#25282B;box-shadow:0 1px 2px rgba(20,20,19,.06),0 8px 28px rgba(20,20,19,.08);position:relative;overflow:hidden;opacity:0;transform:scale(.97);transition:opacity 300ms var(--ease-out),transform 300ms var(--ease-out)}
.dm-page.on{opacity:1;transform:none}
.bk{position:absolute;opacity:0;transform:translateY(6px);transition:opacity 260ms var(--ease-out),transform 260ms var(--ease-out)}
.bk.sk,.bk.ok{opacity:1;transform:none}
.bk::after{content:"";position:absolute;inset:0;border-radius:3px;background:var(--g100);opacity:0;transition:opacity 240ms ease;pointer-events:none}
.bk.sk::after{opacity:1;background:linear-gradient(90deg,var(--g100) 0%,#F6F6F5 45%,var(--g100) 90%);background-size:220% 100%;animation:shim 1.1s linear infinite}
@keyframes shim{from{background-position:120% 0}to{background-position:-100% 0}}
.bk .ct{opacity:0;transition:opacity 280ms var(--ease-out)}
.bk.ok .ct{opacity:1}
.bk .ct.sw{opacity:0}
.bk::before{content:"";position:absolute;inset:-4px;border-radius:5px;box-shadow:0 0 0 2px var(--gr500);opacity:0;transition:opacity 300ms ease;pointer-events:none;z-index:5}
.bk.hl::before{opacity:1}
.br-ban{left:0;top:0;width:462px;height:186px}.br-ban::after{border-radius:0}
.br-ban .ct{position:absolute;inset:0;overflow:hidden;background:#25282B}
.br-ban .ph{position:absolute;transition:opacity 500ms var(--ease-out)}
.br-ban .sh{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.6) 0%,rgba(0,0,0,.25) 40%,rgba(0,0,0,0) 60%),linear-gradient(0deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 40%)}
/* speechmark ink = 86% of the banner depth, body centred on the face; clear of the logo's 0.5 D space */
.br-ban .sm{position:absolute;width:246px;height:246px;left:133px;top:-31px}
.br-ban .lg{position:absolute;right:22px;bottom:16px;width:92px;height:auto}
.br-h{left:22px;top:22px;width:146px;height:70px;color:#fff;font-size:19px;line-height:22px;font-weight:700;z-index:2}
.br-p{left:22px;top:100px;width:146px;height:44px;color:#fff;font-size:10.5px;line-height:14px;font-weight:700;z-index:2}
.br-h::after,.br-p::after{background:rgba(255,255,255,.22)}
.br-i{left:22px;top:200px;width:418px;height:122px}
.br-i h4{color:#E60000;font-size:16px;line-height:19px;font-weight:700}
.br-i .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:8px;font-size:10px;line-height:13.5px}
.br-b{top:332px;width:97px;height:78px;font-size:9.5px;line-height:12.5px;border-top:2px solid #E60000;padding-top:7px}
.br-b::after{top:0}
.br-b b{display:block;font-size:11px;line-height:13px;margin-bottom:3px}
.br-b1{left:22px}.br-b2{left:129px}.br-b3{left:236px}.br-b4{left:343px}
.br-w{left:0;top:420px;width:462px;height:193px}.br-w::after{border-radius:0}
.br-w .ct{position:absolute;inset:0;background:#E60000 url(assets/vb-3d-attracting.jpg) right center/auto 100% no-repeat;color:#fff;padding:16px 22px}
.br-w h5{font-size:15px;line-height:18px;font-weight:700}
.br-w .st{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px;font-size:9.5px;line-height:12.5px;max-width:300px}
.br-w .n{display:block;font-size:26px;line-height:28px;font-weight:700}
.br-w small{display:block;opacity:.85;font-size:8.5px;margin-top:3px}
.br-w .cta{position:absolute;left:22px;right:22px;bottom:16px;display:flex;align-items:flex-end;justify-content:space-between;border-top:1px solid rgba(255,255,255,.45);padding-top:10px}
.br-w .cta b{display:block;font-size:13px;line-height:16px}
.br-w .cta span{font-size:9.5px}
.br-w .btn{background:#fff;color:#E60000;font-size:10.5px;font-weight:700;padding:6px 12px;border-radius:4px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.br-w .btn i{display:grid;place-items:center;width:13px;height:13px;border-radius:50%;background:#E60000;color:#fff;font-style:normal;font-size:9px}
.br-f{left:0;top:613px;width:462px;height:40px}.br-f::after{border-radius:0}
.br-f .ct{position:absolute;inset:0;background:#25282B;color:#fff;font-size:7.5px;line-height:10px;padding:10px 22px}
.vt-soon{display:grid;place-items:center;height:100%;font-size:20px;color:var(--g800)}

/* toolkit home: Gantt rows that open */
.view.toolkit{display:flex;flex-direction:column}
.tk-head,.tk-main{display:grid;grid-template-columns:200px 180px 230px 230px 80px 1fr;align-items:center;column-gap:14px}
.view.toolkit .title{font-size:54px;line-height:60px;max-width:1240px}
.tk-head{margin-top:22px;padding:0 0 9px;border-bottom:2px solid #E60000;font-size:16px;line-height:20px;font-weight:700;color:#E60000}
.tk-head .wk{display:grid;grid-template-columns:repeat(12,1fr)}
.tk-head .wk i{font-style:normal;text-align:center;font-variant-numeric:tabular-nums;font-size:13px}
.tk-rows{flex:1;min-height:0}
.tk-row{border-bottom:1px solid var(--g300)}
.tk-main{cursor:default;width:100%;text-align:left;padding:6px 0;font-size:15px;line-height:19px;transition:background 160ms ease}
.tk-main .nm{font-weight:700}
@media (hover:hover) and (pointer:fine){.tk-main:hover{background:var(--g50)}}
.tk-main .wk{position:relative;height:16px;background:repeating-linear-gradient(90deg,transparent 0 calc(100% / 12 - 1px),var(--g100) calc(100% / 12 - 1px) calc(100% / 12))}
.tk-main .bar{position:absolute;top:2px;height:12px;border-radius:3px;background:#E60000;left:calc(var(--a) * 100% / 12);width:calc((var(--b) - var(--a)) * 100% / 12);transform-origin:left;transform:scaleX(0);transition:transform 600ms var(--ease-out),left 700ms var(--ease-io),width 700ms var(--ease-io),background 300ms ease}
.view.on .tk-main .bar{transform:scaleX(1)}
.tk-row[data-tk] .bar{transition-delay:calc(var(--i,0) * 40ms + 300ms)}
.tk-more{display:grid;grid-template-rows:0fr;transition:grid-template-rows 260ms var(--ease-out)}
.tk-wrap{overflow:hidden;min-height:0}
.tk-row.open .tk-more{grid-template-rows:1fr}
.tk-row.open .tk-main{background:var(--g50)}
.tk-in{display:grid;grid-template-columns:300px 300px 1fr;column-gap:20px;padding:2px 0 12px;font-size:15px;line-height:21px}
.tk-in h6{font-size:13px;font-weight:600;color:var(--g800);margin-bottom:4px}
.tk-in em{font-style:normal;display:inline-block;background:var(--g100);border-radius:6px;padding:3px 9px;margin:0 6px 6px 0;font-size:14px}
.tk-total{margin-top:12px;font-size:20px}
.tk-total b{font-weight:800}

/* toolkit overview: hero with a flipping toolkit (real pages), badge, four content types */
.view.tkover{display:grid;grid-template-columns:600px 1fr;grid-template-rows:1fr auto auto;column-gap:40px}
.view.tkover .title{font-size:76px;line-height:80px}
.tko-left{padding-top:70px}
.tko-left .lead{color:var(--ink);font-size:26px;line-height:36px;margin-top:22px;max-width:560px}
.tko-art{position:relative;height:470px;display:grid;place-items:center}
.fb{position:relative;width:640px;height:360px;perspective:1800px}
.fb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.fb-edge{position:absolute;inset:0;background:#fff;box-shadow:0 1px 2px rgba(20,20,19,.18)}
.fb-edge.e1{transform:translate(5px,5px)}.fb-edge.e2{transform:translate(10px,10px)}.fb-edge.e3{transform:translate(15px,15px);box-shadow:0 14px 34px rgba(20,20,19,.16)}
.fb-under{box-shadow:0 1px 3px rgba(20,20,19,.12)}
.fb-top{transform-origin:left center;backface-visibility:hidden;box-shadow:0 1px 3px rgba(20,20,19,.12)}
.fb-top.flip{transition:transform 900ms var(--ease-io);transform:rotateY(-110deg)}
.fb-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,20,19,.18),rgba(20,20,19,0) 40%);opacity:0;transition:opacity 450ms ease;pointer-events:none}
.fb.turning .fb-shade{opacity:1}
.fb-count{position:absolute;right:56px;bottom:6px;font-size:16px;font-weight:600;background:#fff;border-radius:999px;padding:6px 14px;box-shadow:0 1px 3px rgba(20,20,19,.12)}
.tko-label{grid-column:1;align-self:end;font-size:22px;font-weight:700;margin-bottom:16px}
.tko-badge{grid-column:2;justify-self:end;align-self:end;display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;border-radius:999px;padding:13px 24px;font-size:19px;line-height:24px;margin-bottom:14px}
.tko-badge .i{color:var(--gr500);flex:none}
.tko-badge b{font-weight:700}
.tko-badge button{color:#fff;font-weight:500;text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-decoration-thickness:2px;text-underline-offset:4px}
.tko-band{grid-column:1 / -1;display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--g300);border-radius:16px;margin-bottom:10px}
.tko-stat{text-align:left;padding:28px 30px;transition:background 160ms ease;border-top:4px solid #E60000;background:var(--ink);color:#fff}
.tko-stat+.tko-stat{border-left:1px solid var(--g300)}
.tko-stat:first-child{border-radius:16px 0 0 16px}.tko-stat:last-child{border-radius:0 16px 16px 0}
@media (hover:hover) and (pointer:fine){.tko-stat:hover{background:#2A2A28}}
.tko-band{border-color:var(--ink);overflow:hidden}
.tko-stat+.tko-stat{border-left-color:#3A3A38!important}
.tko-badge{background:#fff!important;color:var(--ink)!important;box-shadow:inset 0 0 0 1.5px var(--ink)}
.tko-badge button{color:var(--ink)!important;text-decoration-color:#E60000!important}
.tko-stat .l{font-size:28px;line-height:34px;font-weight:700;letter-spacing:-0.01em}
.vb-corner{position:absolute;right:88px;top:64px;height:34px;width:auto}
/* side panel content */
.pk-list{margin-top:28px;border-top:1px solid var(--g300)}
.pk-list div{font-size:20px;line-height:28px;padding:11px 0;border-bottom:1px solid var(--g300)}
.pk-cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:28px}
.pk-cols h6{font-size:15px;font-weight:600;color:var(--g800);margin-bottom:6px}
.pk-cols p{font-size:20px;line-height:28px}
.pk-tag{display:inline-block;margin-top:14px;font-size:15px;font-weight:600;background:var(--gr500);border-radius:6px;padding:4px 10px}

/* deep dive: flow diagram (hub and spokes) on the dark ground */
.view.dive .lead{color:#C9C9C6;font-size:22px;line-height:30px;margin-top:10px;max-width:1000px}
.mt-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mt-svg .ln{fill:none;stroke:#46463F;stroke-width:1.5;stroke-dasharray:1;stroke-dashoffset:1}
.view.on .mt-svg .ln{animation:draw 700ms var(--ease-io) forwards;animation-delay:var(--d)}
@keyframes draw{to{stroke-dashoffset:0}}
.mt-svg .fl{fill:none;stroke-width:2.5;stroke-dasharray:4 14;stroke-linecap:round;opacity:0}
.mt-svg .fl.g{stroke:var(--gr500)}.mt-svg .fl.r{stroke:#FF3B30}
.view.on .mt-svg .fl{animation:flowIn 400ms ease 2300ms forwards,flow 1.1s linear 2300ms infinite}
@keyframes flowIn{to{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-18}}
.mt-tile{position:absolute;height:56px;display:flex;align-items:center;gap:16px;font-size:21px;font-weight:600;color:#fff;opacity:0;transform:translateY(6px)}
.view.on .mt-tile{animation:rise 420ms var(--ease-out) forwards;animation-delay:var(--d)}
.mt-tile .bx{width:56px;height:56px;border-radius:14px;flex:none;display:grid;place-items:center;font-style:normal}
.mt-tile.in-t{left:88px}
.mt-tile.in-t .bx{background:#25282B;box-shadow:inset 0 0 0 1px #4A4A44;color:#fff}
.mt-tile.in-t.opt{color:#B8B8B8}.mt-tile.in-t.opt .bx{background:none;box-shadow:none;outline:1.5px dashed #6A6A62;outline-offset:-2px;color:#B8B8B8}
.mt-tile.out-t{left:1236px}
.mt-tile.out-t .bx{background:#E60000;color:#fff}
.mt-hub{position:absolute;left:686px;top:333px;width:228px;height:228px;border-radius:50%;background:#1A1A18;box-shadow:inset 0 0 0 2px var(--gr500);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:0 26px;opacity:0;transform:scale(.94)}
.mt-hub .i{color:var(--gr500)}
.view.on .mt-hub{animation:hubIn 520ms var(--ease-out) 950ms forwards}
@keyframes hubIn{to{opacity:1;transform:none}}
.mt-hub b{font-size:38px;line-height:42px;font-weight:800}
.mt-hub .mt-status{font-size:17px;line-height:22px;font-weight:500;color:#fff;min-height:44px;margin-top:10px;transition:opacity 220ms ease}
.mt-cap{position:absolute;top:200px;width:200px;display:flex;align-items:center;justify-content:center;gap:10px;background:#25282B;box-shadow:inset 0 0 0 1px var(--gr800);border-radius:10px;padding:9px 0;font-size:17px;font-weight:600;color:#fff;opacity:0;transform:translateY(6px)}
.mt-cap .i{color:var(--gr500)}
.view.on .mt-cap{animation:rise 420ms var(--ease-out) forwards;animation-delay:var(--d)}
.mt-eye{font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gr500);margin-bottom:6px}

let brkGL=null,brkRAF=0;
function brkRun(){const c=document.getElementById('brkC'),v=c.closest('.view');cancelAnimationFrame(brkRAF);
  if(!brkGL){const gl=c.getContext('webgl');if(!gl)return;c.width=1600;c.height=900;
    const vs='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
    const fs=`precision mediump float;uniform float t;uniform vec2 r;
      float n(vec2 p){return sin(p.x)*sin(p.y);}
      float f(vec2 p){float a=0.,w=.5;for(int i=0;i<5;i++){a+=w*n(p);p=mat2(1.6,1.2,-1.2,1.6)*p+t*.08;w*=.5;}return a;}
      void main(){vec2 uv=gl_FragCoord.xy/r;vec2 q=uv*vec2(r.x/r.y,1.)*2.2;
        float a=f(q+vec2(f(q+t*.05),f(q-t*.04)));
        float band=smoothstep(.0,.55,a)*smoothstep(1.1,.3,uv.y+uv.x*.3);
        vec3 wht=vec3(1.),grn=vec3(.62,1.,.55);
        vec3 col=mix(wht,grn,band*.75*smoothstep(.15,.8,uv.x));gl_FragColor=vec4(col,1.);}`;
    const sh=(t,src)=>{const o=gl.createShader(t);gl.shaderSource(o,src);gl.compileShader(o);return o};
    const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
    const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
    const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
    brkGL={gl,ut:gl.getUniformLocation(pr,'t'),ur:gl.getUniformLocation(pr,'r'),t0:performance.now()}}
  const {gl,ut,ur,t0}=brkGL;

/* sonar field: grey dot grid, green rings that swell the dots they pass */
const sonar=(()=>{const cv=document.getElementById('sonar'),ctx=cv.getContext('2d'),W=1600,H=900,SP=28,R=1.5,SPEED=130,RW=110,AMP=2.4,EVERY=4200,AREA=[.1,.15,.9,.85];
 const rm=matchMedia('(prefers-reduced-motion: reduce)');let rings=[],raf=0,on=false,next=0;
 const size=()=>{const d=Math.min(devicePixelRatio||1,2)*Math.max(1,parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--s'))||1);cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)};
 const ping=(x,y,t)=>{rings.push({x,y,t});if(rings.length>6)rings.shift()};
 const rand=t=>ping(W*(AREA[0]+Math.random()*(AREA[2]-AREA[0])),H*(AREA[1]+Math.random()*(AREA[3]-AREA[1])),t);
 const draw=now=>{const life=(Math.hypot(W,H)+RW)/SPEED;rings=rings.filter(r=>(now-r.t)/1000<life);
  const live=rings.map(r=>{const a=(now-r.t)/1000;const inn=Math.min(1,a/2),out=Math.max(0,1-a/life);return{x:r.x,y:r.y,rad:a*SPEED,fade:inn*inn*(3-2*inn)*out*out}});
  ctx.clearRect(0,0,W,H);const hot=[];ctx.fillStyle='#656565';ctx.globalAlpha=.7;ctx.beginPath();
  for(let x=SP/2;x<W;x+=SP)for(let y=SP/2;y<H;y+=SP){let e=0;for(const r of live){const d=Math.abs(Math.hypot(x-r.x,y-r.y)-r.rad);if(d<RW){const k=1-d/RW,v=k*k*(3-2*k)*r.fade;if(v>e)e=v}}
   if(e<.02){ctx.moveTo(x+R,y);ctx.arc(x,y,R,0,6.2832)}else hot.push(x,y,e)}
  ctx.fill();ctx.fillStyle='#9EFF8C';
  for(let i=0;i<hot.length;i+=3){const e=hot[i+2];ctx.globalAlpha=.35+.65*e;ctx.beginPath();ctx.arc(hot[i],hot[i+1],R*(1+AMP*e),0,6.2832);ctx.fill()}
  ctx.globalAlpha=1};
 const tick=now=>{raf=0;if(!on||document.hidden)return;if(now>=next){rand(now);next=now+EVERY}draw(now);raf=requestAnimationFrame(tick)};
 cv.parentNode.addEventListener('pointerdown',e=>{if(rm.matches)return;const b=cv.getBoundingClientRect();ping((e.clientX-b.left)/b.width*W,(e.clientY-b.top)/b.height*H,performance.now())});
 document.addEventListener('visibilitychange',()=>{if(on&&!document.hidden&&!raf)raf=requestAnimationFrame(tick)});
 return{start(){size();on=true;if(rm.matches){rings=[];draw(0);return}const t=performance.now();if(!rings.length){ping(W*.5,H*.5,t-1400)}next=t+EVERY;if(!raf)raf=requestAnimationFrame(tick)},stop(){on=false;cancelAnimationFrame(raf);raf=0},size}})();

    await fly(v.querySelector('[data-pr="deep"]'),T('re'));await fill('re',ICPT.re);await w(300);
    agent('writer','Filling the profile in Vodafone’s tone…');
    await fly(v.querySelector('[data-pd="crm"]'),T('ov'));await fill('ov',ICPT.ov);
    await fly(v.querySelector('[data-pd="msg"]'),T('be'));await fill('be',ICPT.be);
    await fly(v.querySelector('[data-pd="icp"]'),T('pu'));await fill('pu',ICPT.pu);
    if(!live())return;const su=T('su');su.classList.remove('sk');const p=su.querySelector('p');for(let i=1;i<=ICPT.su.length;i++){if(!live())return;p.textContent=ICPT.su.slice(0,i);await w(14)}
    agent('','');cp.classList.add('done')})()}

/* ICP variation tabs: same fixed template, content swaps */
document.querySelectorAll('[data-cv]').forEach(b=>b.onclick=()=>{const v=document.querySelector('.view.icpt'),cp=v.querySelector('#cp'),c=ICPV[b.dataset.cv],T=t=>cp.querySelector(`[data-t="${t}"]`);
  icptRun++;v.querySelectorAll('.fly').forEach(f=>f.remove());v.querySelector('#agStatus').textContent='';cp.className='cp branded done';T('hd').classList.add('on');T('lg').classList.add('on');T('ph').classList.add('on');cp.querySelectorAll('.sk').forEach(e=>e.classList.remove('sk'));
  v.querySelectorAll('[data-cv]').forEach(x=>x.setAttribute('aria-pressed',x===b));
  cp.querySelectorAll('.cp-s,.cp-ph').forEach(e=>e.animate([{opacity:1},{opacity:.2},{opacity:1}],{duration:500}));
  setTimeout(()=>{v.querySelector('#cpTitle').textContent='Customer profile: '+c.t;T('ph').querySelector('img').src='assets/'+c.ph;
    ['ov','ch','be','re','pu'].forEach(t=>{T(t).querySelector('ul').innerHTML=c.d[t].map(x=>`<li>${x}</li>`).join('')});T('su').querySelector('p').textContent=c.d.su},200)});
function fit(){const s=Math.min(innerWidth/1600,innerHeight/900);document.getElementById('stage').style.transform=`translate(-50%,-50%) scale(${s})`;document.documentElement.style.setProperty('--s',s);if(typeof sonar!=='undefined')sonar.size()}
addEventListener('resize',fit);fit();

/* gantt */
let curG='t';
function setGantt(m){curG=m;const g=document.getElementById('gantt');g.classList.toggle('ai',m==='a');
  g.querySelectorAll('.grow').forEach(r=>{const s=SECT[+r.dataset.s],[a,b]=m==='a'?s.a:s.t;r.querySelector('.bar').style.transform=`translateX(${a/12*100}%) scaleX(${(b-a)/12})`});
  document.getElementById('gtotal').innerHTML=m==='a'?'<b>About 7 weeks</b>, paced by customer fieldwork':'<b>12 weeks</b> from brief to buyer content';
  document.querySelectorAll('[data-g]').forEach(t=>t.setAttribute('aria-selected',t.dataset.g===m))}
document.querySelectorAll('[data-g]').forEach(t=>t.onclick=()=>setGantt(t.dataset.g));
const drawer=document.getElementById('drawer');
function openDrawer(j){const s=SECT[j];
  drawer.innerHTML=`<button class="close" aria-label="Close">${ICONS['arrow-right']?`<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>`:''}</button>
  <div class="title" style="font-size:40px;line-height:46px">${s.k}</div>
  <div class="dgrid">${[['Faster',s.f],['Cheaper',s.c],['More',s.m],['Better',s.b]].map(x=>`<div><h4>${x[0]}</h4>${x[1].map(y=>`<p>${y}</p>`).join('')}</div>`).join('')}</div>
  <div class="dline"><b>Stays human</b>${s.h}</div><div class="dline" style="margin-top:16px"><b>Ask</b>${s.q}</div>`;
  drawer.querySelector('.close').onclick=closeDrawer;drawer.classList.add('open');drawer.setAttribute('aria-hidden','false')}
function closeDrawer(){drawer.classList.remove('open');drawer.setAttribute('aria-hidden','true')}
document.querySelectorAll('.grow').forEach(r=>r.onclick=()=>openDrawer(+r.dataset.s));

/* market trends pipeline */
let curM='launch',runT=[];
function setMode(m,run){curM=m;const d=MODES[m];
  document.querySelectorAll('[data-m]').forEach(t=>t.tagName==='BUTTON'&&t.setAttribute('aria-selected',t.dataset.m===m));
  document.getElementById('give').innerHTML=d.give.map(g=>`<div class="pitem"><i class="dot ${g[2]?'o':''}"></i>${g[0]}${g[1]?`<span class="opt">${g[1]}</span>`:''}</div>`).join('');
  document.getElementById('get').innerHTML=d.get.map((g,k)=>`<div class="pitem" style="transition-delay:${k*55}ms">${g}</div>`).join('');
  document.getElementById('mtime').textContent=d.time;
  document.getElementById('mwho').innerHTML=`<span style="display:inline-flex;align-items:center;gap:8px"><i class="sw" style="background:${OWN[d.who]}"></i>${d.who==='M'?'Markets, self-serve':'Portfolio marketing, self-serve'}</span>`;
  reset();if(run)play()}
function reset(){runT.forEach(clearTimeout);runT=[];document.getElementById('outcol').classList.remove('done');
  document.querySelectorAll('.meter i').forEach(m=>{m.style.transition='none';m.style.transform='scaleX(0)'})}
function play(){reset();const ms=[...document.querySelectorAll('.meter i')];
  ms.forEach((m,k)=>runT.push(setTimeout(()=>{m.style.transition='transform 700ms cubic-bezier(0.77,0,0.175,1)';m.style.transform='scaleX(1)'},60+k*420)));
  runT.push(setTimeout(()=>document.getElementById('outcol').classList.add('done'),60+ms.length*420+300))}
document.querySelectorAll('button[data-m]').forEach(t=>t.onclick=()=>setMode(t.dataset.m,true));
(document.getElementById('run')||{}).onclick=play;

/* modular */
document.querySelectorAll('#mk .chipbtn').forEach(b=>b.onclick=()=>{document.querySelectorAll('#mk .chipbtn').forEach(x=>x.setAttribute('aria-pressed',x===b));document.querySelectorAll('.mkname').forEach(x=>x.textContent=b.dataset.k)});
[['ptog','pmod'],['ctog','cmod']].forEach(([b,m])=>{const el=document.getElementById(b)||{};el.onclick=()=>{const on=el.getAttribute('aria-pressed')!=='true';el.setAttribute('aria-pressed',on);document.getElementById(m).classList.toggle('hidden',!on)}});

/* answers */
document.querySelectorAll('.qr').forEach(r=>r.onclick=()=>r.classList.toggle('sel'));

/* counts */
function animateNum(el,to,suffix){const t0=performance.now(),d=900;const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){el.textContent=to+suffix;return}
  (function f(t){const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);el.textContent=Math.round(to*e)+suffix;if(p<1)requestAnimationFrame(f)})(t0)}
function countUp(){els[cur].querySelectorAll('[data-count]').forEach((el,k)=>setTimeout(()=>animateNum(el,+el.dataset.count,'%'),200+k*120))}
function countUp2(){els[cur].querySelectorAll('[data-count2]').forEach(el=>setTimeout(()=>animateNum(el,+el.dataset.count2,''),250))}

const start=Math.max(1,Math.min(els.length,parseInt(location.hash.slice(1))||1))-1;cur=start;go(start);
addEventListener('hashchange',()=>{const n=(parseInt(location.hash.slice(1))||1)-1;if(n!==cur&&n>=0&&n<els.length)go(n)});
if(!els[start].classList.contains('on')){els[start].classList.add('on')}
</script>
</body>
