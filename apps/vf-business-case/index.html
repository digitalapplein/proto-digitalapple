<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
/* Layout: a short working list (ten columns). Click a row to open its details underneath. */
:root{
  color-scheme:light;
  --bg:#F3F5EB; --surface:#FFFFFF; --surface2:#ECEFE3; --line:#D8DBD0; --ink:#1C1D1C; --muted:#52554D;
  --green:#0A6B30; --green-soft:#DDF7CC; --amber:#7A5200; --amber-soft:#FBEFC9; --red:#B42318; --red-soft:#FCE5E2; --blue:#005F94;
  --focus:#005F94;
  --font:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --display:"DM Sans",system-ui,sans-serif; --mono:"Open Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto;display:grid;gap:20px}
#view{display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
h1{font:700 26px/1.15 var(--display);letter-spacing:-.02em;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0;max-width:64ch}
.tabs{display:flex;gap:4px;background:var(--surface2);border-radius:999px;padding:3px}
.tab{border:0;background:none;color:var(--muted);font:500 14px var(--font);padding:7px 16px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.bar{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;padding:4px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 18px;display:grid;gap:4px;align-content:start}
.stat span{font-size:12px;color:var(--muted)}
.stat small{font-size:13px;font-weight:500;color:var(--ink)}
.stat b{font:700 24px/1.1 var(--display)}
.meter{display:flex;align-items:center;gap:10px;margin-top:2px}
.mbar{position:relative;flex:1;height:6px;border-radius:999px;background:var(--surface2)}
.mbar u{display:block;height:100%;border-radius:999px;background:var(--green)}.mbar u.bad{background:var(--red)}
.mbar em{position:absolute;top:-4px;width:2px;height:14px;background:var(--ink);opacity:.45}
.meter span{font:700 13px var(--font);color:var(--green);min-width:42px;text-align:right}.meter span.bad{color:var(--red)}
.seg{display:flex;align-items:center;gap:6px;margin-bottom:10px;font-size:13px;color:var(--muted)}
.seg span{margin-right:4px}
.seg button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 14px;font:500 13px var(--font);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{font:700 19px/1.2 var(--font);font-variant-numeric:tabular-nums}
.stat b i{font-style:normal;color:var(--green)}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 13px;font:500 13px var(--font);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.save{margin-left:auto;font-size:12px;color:var(--muted)} .save.err{color:var(--red)}
input[type=search]{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font:14px var(--font);min-width:200px}
.frame{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:auto}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:760px}
th,td{border-bottom:1px solid var(--line);padding:0;vertical-align:middle;background:var(--surface)}
th{background:var(--surface2);font:700 12px/1.2 var(--font);color:var(--muted);text-align:left;padding:9px 10px;white-space:nowrap}
th.n,td.n{text-align:right}
tr.grp td{background:var(--surface2);padding:8px 12px;font:700 13px var(--font)}
tr.grp td small{font-weight:400;color:var(--muted);margin-left:8px}
tr.row:hover td,tr.row.open td{background:var(--surface2)}
.nm{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;border:0;background:none;color:var(--ink);font:500 14px var(--font);text-align:left;width:100%}
.nm .tag{font:500 11px var(--font);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 7px}
.nm .chev{color:var(--muted);display:inline-block;transition:transform .15s}.row.open .chev{transform:rotate(90deg)}
.cell{display:block;width:100%;border:0;background:transparent;color:var(--ink);font:14px/1.4 var(--font);padding:8px 10px;min-height:36px}
.cell:hover{background:var(--surface)} .cell:focus{background:var(--surface);outline:2px solid var(--focus);outline-offset:-2px}
input.cell[type=number]{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:13px;width:84px;margin-left:auto}
select.cell{appearance:none;cursor:pointer;padding-right:6px}
.calc{padding:9px 10px;text-align:right;font:500 13px var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.calc.g{color:var(--green)}
.s-existing{color:var(--green)}.s-enhance{color:var(--amber)}.s-new{color:var(--red)}.s-optional{color:var(--muted)}
.src-said{background:var(--green-soft);color:var(--green)}.src-recommended{background:var(--amber-soft);color:var(--amber)}.src-open{background:var(--red-soft);color:var(--red)}
select.src{border-radius:999px;font-weight:500;font-size:12px;padding:4px 10px;min-height:0;margin:4px 8px;width:auto}
tr.detail td{padding:0;background:var(--bg)}
.dgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;padding:16px}
.dcol{display:grid;gap:12px;align-content:start}
.fld{display:grid;gap:4px}.fld label{font:500 12px var(--font);color:var(--muted)}
.fld input,.fld textarea,.fld select{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 10px;font:14px/1.4 var(--font);width:100%}
.fld textarea{min-height:60px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink)}.chk input{width:auto}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font:500 13px var(--font);padding:6px 0;text-align:left}
.x:hover,.x.arm{color:var(--red)}
.add{border:0;background:none;color:var(--blue);font:500 13px var(--font);padding:8px 12px;cursor:pointer}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
h2{font:700 16px var(--display);margin:0}
.note{color:var(--muted);font-size:13px;margin:0}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.big{display:flex;flex-wrap:wrap;gap:6px 28px;align-items:baseline}
.big b{font:700 30px/1 var(--display);letter-spacing:-.02em}.big b i{font-style:normal;color:var(--green)}
.big span{color:var(--muted);font-size:13px}
.bt td{vertical-align:top}
tr.row.out td:not(:first-child){opacity:.55}
textarea{overflow:hidden;resize:none}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font:500 12px/1.5 var(--font);margin:2px 4px 2px 0;white-space:nowrap}
.pill.req{background:var(--green-soft);color:var(--green)}.pill.opt{background:var(--amber-soft);color:var(--amber)}
.ghead{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px}
.gtog{border:0;background:none;color:var(--ink);font:700 15px var(--display);cursor:pointer;padding:0;display:flex;gap:8px;align-items:center}
.gtog .chev{color:var(--muted);display:inline-block;transition:transform .15s}.grp.open .gtog .chev{transform:rotate(90deg)}
.gp{display:inline-flex;flex-wrap:wrap}.gs{margin-left:auto;font:500 12px var(--mono);color:var(--muted)}
td .gline,.gline{display:flex;align-items:center;gap:6px 22px;flex-wrap:wrap;margin-top:6px;font:400 13px var(--font);color:var(--muted)}
.gline input.cell{width:52px;height:28px;padding:2px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:right;min-height:0;display:inline-block}
.gline .gs{margin-left:auto;font:500 13px var(--font);color:var(--ink)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:6px}
.box .bl{font:500 12px var(--font);color:var(--muted)}
.box textarea,.box input,.box select{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:7px 10px;font:14px/1.5 var(--font);color:var(--ink);width:100%}
.box textarea{border-color:transparent;padding:2px 0}.box textarea:focus{border-color:var(--focus);padding:6px 8px}
.aedit{font-size:13px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.nm.static{cursor:default}.oth .chips{margin:0;padding:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px}
.fchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:3px 4px 3px 10px;font-size:13px}.fchip a{color:var(--blue)}
.fx{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1}
.attach{border:1px solid var(--line);border-radius:8px;padding:4px 12px;font:500 13px var(--font);cursor:pointer;background:var(--surface);display:inline-block}
/* approvers editor */
.pedit{display:flex;flex-wrap:wrap;gap:4px}
.pedit .pill{display:inline-flex;align-items:center;gap:4px;padding-right:4px}
.ptgl{cursor:pointer}.prm{border:0;background:none;color:inherit;cursor:pointer;font-size:15px;line-height:1;padding:0 4px;opacity:.7}
.aadd{font-size:13px}
tr.timing td{background:var(--bg);padding:6px 14px 10px}
.trow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:13px;color:var(--muted)}
.trow .sp{margin-left:14px}.trow input.cell{width:64px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:right}.trow select.cell{width:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tnote{margin-top:4px;color:var(--muted);font-size:13px}
td.calc.bad{color:var(--red)}
::placeholder{color:var(--muted);opacity:1}
tr.subt td{background:var(--surface2);font-weight:700}.subl{padding:8px 12px;font:700 13px var(--font)}
tr.sech td{padding:6px 12px;font:700 12px var(--font);color:var(--muted);background:var(--bg)}
tr.row.oth .nm{font-weight:400}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.nm .tag.rec-recommended{background:var(--amber-soft);color:var(--amber);border-color:transparent}.nm .tag.rec-open{background:var(--red-soft);color:var(--red);border-color:transparent}
.frame{border-radius:18px;border-color:var(--line)}
th{background:transparent;border-bottom:1px solid var(--line);font-weight:500;padding:12px 14px}
tr.grp td{background:var(--surface2);border-top:1px solid var(--line);padding:12px 14px}
th,td{border-bottom-color:transparent}tr.row td{border-bottom:1px solid var(--surface2)}
.calc,input.cell[type=number],.gs{font-family:var(--font);font-variant-numeric:tabular-nums}
input.cell[type=number]{width:72px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:760px){.dgrid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.chip,.tab{transition:background .15s}}
</style>

<style>body{margin:0}</style></head><body>
<div class="wrap">
  <header>
    <div>
      <h1>Marketing Digital Toolkit</h1>
      <p class="sub">How each output is made today and with Amy, with effort, approvals and cost, checkpoint by checkpoint.</p>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sheet">
      <button class="tab" role="tab" data-tab="assets" aria-selected="true">Assets</button>
      <button class="tab" role="tab" data-tab="settings" aria-selected="false">Assumptions</button>
    </nav>
  </header>
  <div id="view"></div>
</div>

<script>
window.SHARE=true;
(function(){
  var D={assets:{},batches:{},settings:{main:{}}},rev=0,ls=[],timer=null,pending=false;
  function snap(c){return {docs:Object.keys(D[c]).map(function(id){return {id:id,data:function(){return JSON.parse(JSON.stringify(D[c][id]))}}})}}
  function emit(){ls.forEach(function(f){f()})}
  function save(){pending=true;clearTimeout(timer);timer=setTimeout(function(){rev++;fetch("api/toolkit",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({rev:rev,assets:D.assets,batches:D.batches,settings:D.settings})}).then(function(){pending=false}).catch(function(){pending=false})},500)}
  var db={collection:function(c){return {doc:function(id){return {
      set:function(d){D[c][id]=JSON.parse(JSON.stringify(d));save();emit();return Promise.resolve()},
      update:function(d){D[c][id]=Object.assign(D[c][id]||{},JSON.parse(JSON.stringify(d)));save();emit();return Promise.resolve()},
      delete:function(){delete D[c][id];save();emit();return Promise.resolve()}}},
    onSnapshot:function(cb){var f=function(){cb(snap(c))};ls.push(f);f()}}},
    doc:function(path){return {onSnapshot:function(cb){var f=function(){cb({exists:true,data:function(){return Object.assign({},D.settings.main)}})};ls.push(f);f()}}}};
  function take(j){rev=j.rev||0;D.assets=j.assets||{};D.batches=j.batches||{};D.settings=j.settings||{main:{}};if(!D.settings.main)D.settings.main={}}
  var ready=fetch("api/toolkit").then(function(r){return r.json()}).then(function(j){
    if(j&&j.assets&&Object.keys(j.assets).length)return j;
    return fetch("toolkit-seed.json").then(function(r){return r.json()});
  }).then(function(j){take(j)});
  setInterval(function(){if(pending)return;fetch("api/toolkit").then(function(r){return r.json()}).then(function(j){if(j&&j.rev>rev){take(j);emit()}}).catch(function(){})},15000);
  window.claude={use:function(n){
    if(n==="db")return ready.then(function(){return db});
    if(n==="assets")return Promise.resolve({upload:function(file){return fetch("api/upload?name="+encodeURIComponent(file.name),{method:"POST",body:file}).then(function(r){return r.json()}).then(function(j){return {id:j.url,url:j.url,sizeBytes:file.size,contentType:file.type}})}});
    if(n==="downloads")return Promise.resolve({save:function(o){var b=new Blob([o.data],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=o.filename;document.body.appendChild(a);a.click();a.remove();return Promise.resolve()}});
    return Promise.resolve(null)}};
})();
</script>
<script>
(function(){
var STATUS={existing:"Existing",enhance:"Enhance",new:"New",optional:"Optional"};
var SCOPE={in:"In scope",out:"Out of scope"};
var TYPE={output:"Output",input:"Input",document:"Supporting document"};
var openCp={},amyOpt="self",canUpload=false,assetsApi=null;
var SRC={said:"Confirmed",recommended:"Recommended",open:"Open"};
var KIND={step:"In sequence",with:"With the batch before",track:"Runs alongside everything"};
var db=null, assets={}, batches={}, settings={}, tab="assets", filter="all", q="", openId=null, editing=false, dirty=false, saveState="";
var pending={}, timers={}, busy={};
var view=document.getElementById("view");
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function num(v){var n=parseFloat(v);return isFinite(n)?n:0}
function eur(n){return "€"+Math.round(n).toLocaleString("en-GB")}
function S(k,d){return settings[k]!=null?settings[k]:d}
function inScope(a){return a.scope!=="out"}
function price(a,opt){if(opt==="self"&&a.selfNA)opt="dfy";if(a.size==="included")return 0;var ov=a[opt==="dfy"?"amyPriceDfy":"amyPriceSelf"];if(ov!==""&&ov!=null&&isFinite(parseFloat(ov)))return num(ov);var z=a.size==="large"?"Large":a.size==="small"?"Small":"Medium";return S((opt==="dfy"?"dfy":"self")+z,0)}
function costToday(a){return num(a.effort)*S("rate",100)+num(a.agency)}
function costAmy(a,opt){return num(a.effortAmy)*S("rate",100)+(a.agencyMakes?num(a.agency):price(a,opt))}
function amyTxt(a,opt){if(opt==="self"&&a.selfNA)return "NA";return eur(costAmy(a,opt))}
function list(m){return Object.keys(m).map(function(k){return m[k]}).sort(function(x,y){return num(x.order)-num(y.order)})}

function autosize(root){(root||document).querySelectorAll("textarea").forEach(function(el){el.style.height="auto";el.style.height=(el.scrollHeight+2)+"px"})}
function stamp(t,cls){saveState=t;var e=$("#save");if(e){e.textContent=t;e.className="save "+(cls||"")}}
function queue(coll,id,fields){
  var k=coll+"/"+id; pending[k]=Object.assign(pending[k]||{},fields); stamp("Saving…");
  clearTimeout(timers[k]); timers[k]=setTimeout(function(){flush(coll,id)},600);
}
function flush(coll,id){
  var k=coll+"/"+id; if(busy[k]){timers[k]=setTimeout(function(){flush(coll,id)},300);return}
  var data=pending[k]; if(!data||!db)return; pending[k]=null; busy[k]=true;
  var ref=db.collection(coll).doc(id);
  var p=(coll==="settings")?ref.set(Object.assign({},settings,data)):ref.update(data);
  p.then(function(){busy[k]=false;if(!Object.keys(pending).some(function(x){return pending[x]}))stamp("Saved")})
   .catch(function(e){busy[k]=false;stamp(e&&e.code==="invalid_argument"?"You can view this sheet but not change it":"Not saved: "+(e&&e.code||"error"),"err")});
}

function cycle(){
  var t=0,a=0,at=0,aa=0,pt=0,pa=0;
  list(batches).forEach(function(b){
    at+=num(b.apprToday);aa+=num(b.apprAmy);
    if(b.kind==="track")return;
    if(b.kind==="with"){t=t-pt+Math.max(pt,num(b.daysToday));a=a-pa+Math.max(pa,num(b.daysAmy));pt=Math.max(pt,num(b.daysToday));pa=Math.max(pa,num(b.daysAmy));return}
    t+=num(b.daysToday);a+=num(b.daysAmy);pt=num(b.daysToday);pa=num(b.daysAmy);
  });
  return {t:t,a:a,at:at,aa:aa};
}
function stats(){
  var dfy=amyOpt==="dfy",rows=list(assets).filter(function(a){return a.status!=="optional"&&inScope(a)&&(!a.type||a.type==="output")});
  var e0=0,e1=0,c0=0,c1=0,y0=0,y1=0,cy=cycle();
  rows.forEach(function(a){var v=num(a.volume),t=costToday(a),s=costAmy(a,dfy?"dfy":"self");e0+=num(a.effort);e1+=num(a.effortAmy);c0+=t;c1+=s;y0+=t*v;y1+=s*v});
  var cap=num(S("dfyCap",50));
  function card(l,v0,v1,n0,n1,tick){
    var r=n0>0?n1/n0:0,sv=n0>0?Math.round((1-r)*100):0,bad=tick&&r*100>cap+0.0001;
    return '<div id="stat_'+l.toLowerCase().replace(/[^a-z]+/g,"-")+'" class="stat"><small>'+l+'</small><b>'+v0+' <i>→ '+v1+'</i></b><div class="meter"><div class="mbar"><u class="'+(bad?"bad":"")+'" style="width:'+Math.min(100,Math.round(r*100))+'%"></u>'+(tick?'<em title="Done-for-you limit: '+cap+'% of today" style="left:'+cap+'%"></em>':'')+'</div><span class="'+(bad?"bad":"")+'">'+(n0>0?(sv>=0?"−":"+")+Math.abs(sv)+"%":"–")+'</span></div></div>'}
  return '<div class="seg" role="group" aria-label="Show Amy as"><span>Show Amy as</span><button data-opt="self" aria-pressed="'+!dfy+'">Self-service</button><button data-opt="dfy" aria-pressed="'+dfy+'">Done-for-you</button></div>'+
   '<div class="stats">'+
   card("Vodafone effort per launch",fmt(e0)+" h",fmt(e1)+" h",e0,e1,false)+
   card("Cost per launch",eur(c0),eur(c1),c0,c1,dfy)+
   card("Cost for the year",eur(y0),eur(y1),y0,y1,dfy)+
   card("Cycle time",(cy.t/5).toFixed(0)+" wk",(cy.a/5).toFixed(0)+" wk",cy.t,cy.a,false)+
   card("Approval rounds",cy.at,cy.aa,cy.at,cy.aa,false)+
   '</div>';
}
function refreshCalc(){
  document.querySelectorAll("[data-calc]").forEach(function(el){
    var p=el.dataset.calc.split(":"),a=assets[p[1]];if(!a)return;
    el.textContent=p[0]==="c0"?eur(costToday(a)):amyTxt(a,p[0]);
  });
  document.querySelectorAll("[data-sub]").forEach(function(el){var p=el.dataset.sub.split(":");el.textContent=subTxt(p[0],p[1])});

function parseAppr(t){
  t=String(t||"").replace(/\([^)]*\)/g,"");
  var req=[],opt=[];
  t.split(";").forEach(function(s,i){
    var optional=i>0||/at times/i.test(s);
    s=s.replace(/at times/ig,"").replace(/\bfirst\b/ig,"");
    s.split(/,| then | and | or /i).forEach(function(p){p=p.trim();if(p)(optional?opt:req).push(p)});
  });
  return {req:req,opt:opt};
}
function pills(p){

function sub(bid){

  list(assets).forEach(function(a){
    if(a.batch!==bid||!isOut(a)||!inScope(a)||a.status==="optional")return;
    t.n++;t.e0+=num(a.effort);t.e1+=num(a.effortAmy);t.ag+=num(a.agency);t.c0+=costToday(a);t.c1+=costAmy(a,"self");t.c2+=costAmy(a,"dfy");
  });

}
function subTxt(k,bid){

  var tg=e.target.closest("[data-tog]");if(tg){openCp[tg.dataset.tog]=!openCp[tg.dataset.tog];render();return}
  var fo=e.target.closest("[data-fold]");if(fo){list(batches).forEach(function(b){openCp[b.id]=fo.dataset.fold!=="in"});render();return}
  var d=e.target.closest("[data-del]");if(d){if(d.classList.contains("arm")){openId=null;db.collection("assets").doc(d.dataset.del).delete().catch(function(){stamp("Not deleted","err")})}else{d.classList.add("arm");d.textContent="Click again to delete";setTimeout(function(){d.classList.remove("arm");d.textContent="Delete this row"},2500)}return}
  if(e.target.closest("[data-csv]"))csv();
});
document.addEventListener("keydown",function(e){
  var t=e.target;if(e.key!=="Enter"||!t.dataset||!t.dataset.padd)return;
  var v=t.value.trim().replace(/[;,]/g," ").replace(/\s+/g," ");if(!v)return;e.preventDefault();
  var A=assets[t.dataset.padd];if(!A)return;var L=apprList(A);if(L.some(function(x){return x[0].toLowerCase()===v.toLowerCase()}))return;
  L.push([v,0]);L.sort(function(x,y){return x[1]-y[1]});setAppr(t.dataset.padd,L);
});
document.addEventListener("change",function(e){
  var t=e.target;if(!t.dataset||!t.dataset.attach||!assetsApi||!t.files||!t.files[0])return;
  var id=t.dataset.attach,file=t.files[0];stamp("Uploading…");
  assetsApi.upload(file).then(function(r){var a=assets[id];if(!a)return;var nf=(a.files||[]).concat([{id:r.id,url:r.url,name:file.name}]);a.files=nf;queue("assets",id,{files:nf});render()}).catch(function(){stamp("Could not upload the file","err")});
});
function onEdit(e){
  var t=e.target;
  if(t.id==="q"){q=t.value.toLowerCase();var pos=t.selectionStart;render();var n=$("#q");n.focus();n.setSelectionRange(pos,pos);return}
  if(t.dataset&&t.dataset.appr){var aid=t.dataset.id,rq=document.getElementById("f_"+aid+"req").value.trim(),op=document.getElementById("f_"+aid+"opt").value.trim(),tx=rq+(op?"; "+op:"");if(assets[aid])assets[aid].approvers=tx;queue("assets",aid,{approvers:tx});dirty=true;return}
  if(t.tagName==="TEXTAREA")autosize(t.parentNode);
  if(!t.dataset||!t.dataset.d)return;
  var coll=t.dataset.d,id=t.dataset.id,f=t.dataset.f,v=t.type==="checkbox"?t.checked:t.value;
  if(t.dataset.num)v=v===""?"":num(v);
  if(t.dataset.list)v=v.split("\n").map(function(x){return x.trim()}).filter(Boolean);
  var m=coll==="assets"?assets:coll==="batches"?batches:null;
  if(coll==="settings")settings[f]=v;else if(m&&m[id])m[id][f]=v;
  var fields={};fields[f]=v;queue(coll,id,fields);
  refreshCalc();
  if(t.tagName==="SELECT"&&(f==="status"||f==="source"||f==="kind"||f==="option"||f==="size"||f==="scope"||f==="type"||f==="batch")){
    t.className=t.className.replace(/\b(s|src)-\w+/,function(x,p){return p+"-"+v});
    if(f==="size"||f==="option"||f==="scope"||f==="type"||f==="batch")render();
  }
}
view.addEventListener("input",onEdit);
view.addEventListener("change",function(e){if(e.target.type==="checkbox"||e.target.tagName==="SELECT")onEdit(e)});
view.addEventListener("focusin",function(e){if(e.target.matches("input,textarea,select"))editing=true});
view.addEventListener("focusout",function(){editing=false;setTimeout(function(){if(!editing&&dirty){dirty=false;render()}},50)});

function csv(){
  claude.use("downloads").then(function(dl){
    if(!dl){stamp("Download is not available here","err");return}
    var cols=[["batch","Batch"],["name","Asset"],["status","Status"],["scope","Scope"],["volume","Volume a year"],["outputs","Output"],["today","Today"],["how","Where it comes from"],["makes","Who makes it today"],["effort","Effort today h"],["agency","Agency EUR a piece"],["req","Required approvers"],["opt","Optional approvers"],["type","Type"],["size","Size"],["agencyMakes","Agency still makes it"],["effortAmy","Effort with Amy h"],["withAmy","With Amy"],["provide","Please provide"]];
    var bn={};list(batches).forEach(function(b){bn[b.id]=b.name});
    var lines=[cols.map(function(c){return '"'+c[1]+'"'}).join(",")];
    list(assets).forEach(function(a){lines.push(cols.map(function(c){var v=c[0]==="batch"?bn[a.batch]:c[0]==="req"?parseAppr(a.approvers).req.join(", "):c[0]==="opt"?parseAppr(a.approvers).opt.join(", "):c[0]==="type"?(a.type||"output"):a[c[0]];return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'}).join(","))});
    return dl.save({filename:"toolkit-base-sheet.csv",data:lines.join("\n")});
  }).catch(function(){});
}

render();
var loading=setTimeout(function(){if(!Object.keys(assets).length)stamp("Still loading the data…")},10000);
function fromSnap(snap){var o={};snap.docs.forEach(function(d){o[d.id]=Object.assign({},d.data())});return o}
function changed(){clearTimeout(loading);if(editing){dirty=true;refreshCalc();return}render()}
claude.use("assets").then(function(a){assetsApi=a;canUpload=!!a;if(a)render()}).catch(function(){});
claude.use("db").then(function(d){
  if(!d){stamp("Sign in to see and edit the sheet","err");return}
  db=d;
  db.collection("assets").onSnapshot(function(s){assets=fromSnap(s);changed()},function(){stamp("Could not read the assets","err")});
  db.collection("batches").onSnapshot(function(s){batches=fromSnap(s);changed()},function(){});
  db.doc("settings/main").onSnapshot(function(s){settings=s.exists?Object.assign({},s.data()):{};changed()},function(){});
});
})();
</script>
