<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Content at scale with AI · Vodafone Business</title>
<style>
/* ------------------------------------------------------------------
   Business case tool. Layout follows the Nebius TCO calculator:
   the inputs on the left, the answer top right, the detail below.
   Brand: ClearView DESIGN.md (application density).
   ------------------------------------------------------------------ */
@font-face{font-family:"DM Sans";src:url(assets/dm-sans-400.woff2) format("woff2");font-weight:400}
@font-face{font-family:"DM Sans";src:url(assets/dm-sans-700.woff2) format("woff2");font-weight:700}
@font-face{font-family:"Open Sans";src:url(assets/open-sans-400.woff2) format("woff2");font-weight:400}
@font-face{font-family:"Open Sans";src:url(assets/open-sans-700.woff2) format("woff2");font-weight:700}
:root{
  --ink:#1C1D1C; --body:#333; --second:#41443D; --tert:#52554D;
  --line:#D8DBD0; --card:rgba(28,29,28,.24); --surface:#F0F2EA; --cream:#F3F5EB;
  --pale:#CCFFB4; --link:#0A7F39; --red:#B42318; --over:#005F94;
  --t1:#1C1D1C; --t2:#4A4D46; --t3:#8A8D84; --wait:#F6D77A; --save:#2F8A1F;
  --display:"DM Sans",system-ui,sans-serif; --sans:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.23,1,.32,1); --r-in:8px; --r-card:18px; --container:1328px;
}
*{box-sizing:border-box}
html{scrollbar-color:rgba(28,29,28,.25) transparent;scrollbar-width:thin}
body{margin:0;background:#fff;color:var(--ink);font:400 13px/20px var(--sans);-webkit-font-smoothing:antialiased;caret-color:var(--link)}
::selection{background:var(--pale);color:var(--ink)}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:2px;border-radius:6px}
.wrap{max-width:var(--container);margin:0 auto;padding:0 40px}
svg.i{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}

/* header */
header.site{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.88);backdrop-filter:blur(14px) saturate(160%);border-bottom:1px solid var(--line)}
header.site .row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:16px;height:54px}
.hl{display:flex;align-items:center;gap:14px;min-width:0}
.hl .stamp{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr{display:flex;align-items:center;justify-content:flex-end;gap:12px}
header.site img{height:22px;display:block}
.rule{width:1px;height:20px;background:var(--line)}
.ctx{font:700 13px/16px var(--display);white-space:nowrap}
.stamp{font-size:12px;color:var(--tert)}
.tabs{display:flex;gap:2px;background:var(--surface);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;padding:5px 14px;border-radius:999px;font:700 12px/16px var(--display);color:var(--second);transition:background .2s var(--ease),color .2s}
.tabs button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sp{flex:1}
.saved{font-size:11px;color:var(--tert)}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:6px 14px;font:700 12px/16px var(--display);white-space:nowrap;transition:transform .12s var(--ease),background .2s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.ghost:hover{background:#EBEDE4}
.btn.lime{background:linear-gradient(90deg,#95FF64,#73F4A7);color:var(--ink)}
.btn.lime:hover{background:linear-gradient(90deg,#73F4A7,#95FF64)}
.btn.wide{width:100%;justify-content:center}

/* intro */
.intro{padding:26px 0 0}
.intro h1{font:700 30px/34px var(--display);letter-spacing:-.02em}
.intro p{margin-top:6px;font-size:14px;line-height:21px;color:var(--second);max-width:80ch}

/* the three zones */
.grid{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:20px;margin-top:18px;align-items:start}
.grid.wide{grid-template-columns:minmax(0,320px) minmax(0,1fr)}
.askcol{position:sticky;top:72px;max-height:calc(100vh - 90px);overflow:auto;scrollbar-width:thin}
.answers{min-width:0;display:flex;flex-direction:column;gap:14px}
.ask{border:1px solid var(--card);border-radius:var(--r-card);padding:14px 12px}
.ask h2{font:700 15px/20px var(--display);padding:0 4px}
.lede{font-size:11px;line-height:16px;color:var(--tert);margin:2px 4px 8px}

/* asset list */
.sec{display:flex;align-items:center;gap:4px;margin:8px 4px 1px;font:700 13px/18px var(--display);color:var(--ink)}
.sec .nm{flex:1;min-width:0}
.it{display:flex;align-items:center;gap:6px;padding:2px 6px 2px 22px;border-radius:7px;cursor:pointer;font-size:12px;line-height:16px;color:var(--second)}
.it.kit{padding:4px 6px;font:700 14px/18px var(--display);color:var(--ink);margin-top:12px}
.rtop{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--second);padding:0 4px 2px}
.rtop b{color:var(--ink);font-family:var(--display)}
.rtop .railbtn.in{margin:0 -4px 0 -6px}
.planblk .pbody{display:flex;align-items:flex-end;gap:24px;padding:12px 14px}
.planblk .plan{width:360px;margin:0}
.planblk .tiersbtn{margin-bottom:6px}
.planblk .tscroll{border-top:1px solid var(--line)}
/* the list hides to give the page room */
.grid.slimg{grid-template-columns:36px minmax(0,1fr)}
.askcol.slim{display:flex;justify-content:center;padding-top:4px}
.railbtn{border:1px solid var(--card);background:#fff;border-radius:8px;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;color:var(--second)}
.railbtn:hover{color:var(--ink);background:var(--surface)}
.railbtn.in{width:24px;height:24px;border:0;background:none;margin:-3px 4px 0 -4px;vertical-align:middle}
.pgap{height:22px}
/* the FY27 plan, in Vodafone's tiers */
.plan{background:var(--surface);border-radius:12px;padding:8px 8px 6px;margin:0 0 2px}
.ph-h,.ph-r{display:grid;grid-template-columns:1fr repeat(3,40px);gap:4px;align-items:center;white-space:nowrap}
.ph-h{font:700 11px/14px var(--display);color:var(--second);margin-bottom:4px}
.ph-h span{color:var(--ink);font-size:12px}
.ph-h b{text-align:right;padding-right:6px;cursor:default}
.ph-r{font-size:12px;line-height:16px;color:var(--second);min-height:26px}
.ph-r .num{width:40px;background:#fff}
.ph-c{display:flex;gap:14px;margin-top:6px;padding-top:6px;border-top:1px solid var(--line);font-size:12px;color:var(--second)}
.ph-c b{color:var(--ink);font-family:var(--display)}
.it:hover{background:var(--surface)}
.it.on{background:var(--pale);color:var(--ink);font-weight:700}
.it .nm{flex:1;min-width:0}
.it.kid{padding-left:36px;color:var(--t2)}
.it.blank .nm{color:var(--tert)}
tr.blank td{color:var(--tert)}
tr.blank .num{opacity:.8}
.aname{border:0;background:none;padding:0;font:400 12px/16px var(--sans);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-align:left;display:block}
.aname:hover{text-decoration:underline;text-underline-offset:3px}
.it .grip{margin-left:-2px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--save);flex:none}
.hov{opacity:0;transition:opacity .15s}
.it:hover .hov,.sec:hover .hov,tr:hover .hov,.hov:focus-visible{opacity:1}
.mini{border:0;background:none;color:var(--tert);padding:2px;border-radius:5px;display:inline-flex}
.mini:hover{color:var(--ink);background:#EBEDE4}
.grip{cursor:grab;color:var(--tert);display:inline-flex}
.edit{border:1px solid var(--link);border-radius:6px;padding:0 5px;width:100%;background:#fff;font-weight:inherit;font-size:inherit}
.addrow{display:flex;gap:6px;margin:12px 4px 2px}
.addrow button{border:1px dashed rgba(28,29,28,.4);background:none;border-radius:999px;padding:3px 10px;font:700 11px/16px var(--display);color:var(--second);display:inline-flex;gap:4px;align-items:center}
.addrow button:hover{border-style:solid;color:var(--ink)}
.drop-over{box-shadow:inset 0 2px 0 var(--link)}

/* fields in the ask column */
.fld{display:grid;grid-template-columns:1fr 64px;align-items:center;gap:6px;padding:2px 4px;min-height:28px}
.fld label{font-size:12px;line-height:16px;color:var(--second)}
.fld .u{grid-column:2;font-size:11px;color:var(--tert);text-align:right;margin-top:-4px}
.fgrp{font:700 11px/14px var(--display);color:var(--tert);margin:12px 4px 4px;display:flex;align-items:center;gap:6px}
.fgrp:first-of-type{margin-top:2px}
.pillrow{display:flex;gap:4px;flex-wrap:wrap;padding:0 4px}
.pill{border:1px solid var(--card);background:#fff;border-radius:999px;padding:4px 11px;font:700 12px/16px var(--display);color:var(--second)}
.pill:hover{background:var(--surface)}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.ask hr{border:0;border-top:1px solid var(--line);margin:12px 4px}
.actcol{display:flex;flex-direction:column;gap:6px;padding:0 4px}

/* hero: the answer */
.hero{position:relative;overflow:hidden;border-radius:var(--r-card);padding:20px 26px 20px}
/* one ground, no wash: green is kept for the AI side of the charts */
.hero::before{content:"";position:absolute;inset:0;z-index:0;background:#F3F5EB}
.hero>*{position:relative;z-index:1}
.headline{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.headline .n{font:700 52px/1 var(--display);letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.headline .u{font:700 15px/20px var(--display);color:var(--second)}
.chip{display:inline-block;background:linear-gradient(90deg,#95FF64,#73F4A7);color:var(--ink);border-radius:999px;padding:2px 10px;font:700 12px/18px var(--display)}
.says{margin-top:6px;font-size:13px;line-height:19px;color:var(--second)}
.says b{color:var(--ink)}
.three{margin-top:16px;padding-top:12px;border-top:1px solid rgba(28,29,28,.2);display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.three .k{font-size:11px;line-height:15px;color:var(--second);display:flex;align-items:center}
.three .v{font:700 22px/28px var(--display);letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:1px}
.three .s{font-size:11px;line-height:15px;color:var(--second)}
.wf{margin-top:14px;padding-top:12px;border-top:1px solid rgba(28,29,28,.2)}
.wf h3{font:700 12px/16px var(--display);margin-bottom:6px;display:flex;align-items:center}
.wfrow{display:grid;grid-template-columns:150px 1fr 84px;gap:10px;align-items:center;height:20px}
.wfrow .l{font-size:12px;line-height:16px;color:var(--second);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wfrow .t{position:relative;height:9px}
.wfrow .b{position:absolute;top:0;height:9px;border-radius:3px}
.wfrow .b.grab{cursor:ew-resize}
.wfrow .v{font:700 12px/16px var(--sans);text-align:right;font-variant-numeric:tabular-nums}
.wfrow.anchor{height:22px}
.wfrow.anchor .l{font-weight:700;color:var(--ink)}
.legend{display:flex;gap:12px;font-size:11px;color:var(--second);margin-top:6px}
.legend i{display:inline-block;width:10px;height:7px;border-radius:2px;margin-right:4px;vertical-align:0}
.neg{color:var(--red)}

/* as-is hero: cost and time side by side, steps below */
.twin{display:grid;grid-template-columns:1.15fr 1fr;gap:28px;margin-top:10px}
.blk .bh{display:flex;align-items:center;gap:8px;font:700 12px/16px var(--display);color:var(--second)}
.blk .bh .pillrow{margin-left:auto;padding:0}
.blk .bh .pill{padding:2px 9px;font-size:11px}
.fig{font:700 40px/1 var(--display);letter-spacing:-.025em;font-variant-numeric:tabular-nums;margin-top:8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.fig small{font:700 13px/16px var(--display);color:var(--second);letter-spacing:0}
.stack{display:flex;height:14px;border-radius:4px;overflow:hidden;margin-top:12px;background:rgba(28,29,28,.06)}
.stack i{display:block;height:100%;transition:width .35s var(--ease);cursor:default}
.stack i:hover{filter:brightness(.92)}
.keys{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:12px;color:var(--second)}
.keys span{display:inline-flex;align-items:center;gap:6px}
.keys i{width:9px;height:9px;border-radius:2px;display:inline-block}
.keys b{color:var(--ink);font-variant-numeric:tabular-nums}
.c-team{background:#1C1D1C}.c-market{background:#6B6E65}.c-agency{background:#4A4D46}.c-other{background:#C9CBC2}.c-tobe{background:#33A100}.c-wait{background:repeating-linear-gradient(135deg,#B9BBB2 0 3px,#E4E6DD 3px 6px)}.c-dep{background:#DCDED5}.c-span{background:rgba(28,29,28,.22)}
.c-make{background:#1C1D1C}.c-appr{background:#8A8D84}.c-mkt{background:#C9CBC2}
/* the same phases with AI, in ClearView greens */
.trow.ai .c-make,.gantt.ai .c-make,.c-ai-key{background:#2F8A1F}
.trow.ai .c-appr,.gantt.ai .c-appr{background:#7CCB4E}
.trow.ai .c-dep,.gantt.ai .c-dep{background:#D7F5C4}
.trow.ai .c-wait,.gantt.ai .c-wait{background:repeating-linear-gradient(135deg,#A9DE8C 0 3px,#E6F8DA 3px 6px)}
.gantt.ai .c-span{background:rgba(51,161,0,.32)}
/* the joint case: the old way in greys, what is paid to Amy in Amy's coral
   (amyagent.ai), the result with AI in one green */
.k-team{background:#55584F}.k-market{background:#8A8D84}.k-agency{background:#1C1D1C}.k-other{background:#D3D5CC}
.k-dfy{background:#FF7A6A}.k-self{background:#FFB0A6}.k-platform{background:#FFD6D0}.k-oneoff{background:#FFE9E5}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;flex:none}
.ph{width:10px;height:10px;border-radius:3px;border:0;padding:0;flex:none;cursor:pointer}
.ph:hover{outline:2px solid rgba(28,29,28,.18);outline-offset:1px}
span.ph{cursor:default}
.ahead{display:flex;align-items:center;gap:12px}
.ahead .title{flex:1;min-width:0}
.chips{display:flex;gap:6px;flex:none}
.chips select.sel{background-color:rgba(255,255,255,.7);border:1px solid var(--card);border-radius:999px;padding:3px 22px 3px 10px;font:700 12px/16px var(--display);min-width:0;max-width:220px;width:auto}
.fig .to{color:var(--tert);font-weight:400;margin:0 8px;font-size:28px}
.fig .ai{color:var(--save)}
.twin .trow{margin-top:10px}
.twin .fig{margin-bottom:4px}
tr.out td{background:#FAFBF7}
.resline{display:flex;align-items:center;gap:6px;margin-top:14px;padding:10px 14px;border-radius:12px;background:#F3F5EB;font-size:13px;color:var(--second)}
.resline b{color:var(--ink);font:700 15px/18px var(--display)}
.resline .lnk{margin-left:auto}
.tbtop{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:14px;margin-top:14px;align-items:start}
.agrid{columns:3 230px;column-gap:26px;padding:6px 14px 12px}
.ag{break-inside:avoid;margin-bottom:8px}
.ag h4{font:700 11px/14px var(--display);color:var(--tert);margin:6px 0 4px}
.af{display:grid;grid-template-columns:1fr 64px 62px;gap:6px;align-items:center;min-height:28px;font-size:12px;color:var(--second)}
.af em{font-style:normal;font-size:11px;color:var(--tert)}
/* Business case: switch, tiles, waterfall, treemap, waffle */
.bctop{display:flex;justify-content:space-between;align-items:center;gap:12px}
.bctop .pillrow{padding:0}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:#fff;border:1px solid var(--card);border-radius:14px;padding:12px 14px}
.tile .k{display:flex;align-items:center;font:700 12px/16px var(--display);color:var(--second)}
.tile .v{font:700 34px/1.1 var(--display);letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;line-height:16px;color:var(--second);margin-top:4px}
.waffle{display:flex;flex-wrap:wrap;gap:3px;margin-top:8px}
.waffle i{width:14px;height:14px;border-radius:3px;background:linear-gradient(90deg,var(--c) var(--f),rgba(28,29,28,.08) var(--f))}
.waffle i.k-team{background:linear-gradient(90deg,#33A100 var(--f),rgba(28,29,28,.1) var(--f))}
.waffle i.k-market{background:linear-gradient(90deg,#95FF64 var(--f),rgba(28,29,28,.1) var(--f))}
.bcviz{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px;margin-top:12px}
.bcviz>div{background:#fff;border:1px solid var(--card);border-radius:14px;padding:14px 16px 12px}
.bcviz .bh{font:700 12px/16px var(--display);color:var(--second);margin-bottom:8px}
.wf2{display:flex;gap:10px;height:230px;align-items:stretch}
.wcol{flex:1;display:flex;flex-direction:column;min-width:0}
.wcol span{font-size:11px;line-height:14px;color:var(--second);text-align:center;margin-top:6px;min-height:28px}
.wplot{position:relative;flex:1;border-bottom:1px solid rgba(28,29,28,.3)}
.wplot b{position:absolute;left:8%;right:8%;border-radius:4px}
.wplot b em{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font:700 12px/16px var(--display);font-style:normal;white-space:nowrap;padding-bottom:3px;color:var(--ink)}
.wf-old{background:#1C1D1C}.wf-ai{background:#33A100}.wf-down{background:#ECEDE6;box-shadow:inset 0 0 0 1px #A5A79E}.wf-up{background:#FF7A6A}
.legend i.wf-old,.legend i.wf-ai,.legend i.wf-down,.legend i.wf-up{width:10px}
.tmap{display:flex;gap:4px;height:258px}
.tmcol{display:flex;flex-direction:column;gap:4px;min-width:0}
.tmb{border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-height:0;overflow:hidden}
.tmb b{font:700 14px/18px var(--display)}
.tmb span{font-size:12px;line-height:16px}
.tmb i{font-style:normal;font:700 12px/16px var(--display);margin-top:auto}
.tmb.t1{background:#1C1D1C;color:#fff}.tmb.t2{background:#55584F;color:#fff}.tmb.t3{background:#C9CBC2;color:var(--ink)}
.tmb i{align-self:flex-start;background:#CCFFB4;color:var(--ink);border-radius:999px;padding:1px 8px}
@media (max-width:1080px){.tiles{grid-template-columns:repeat(2,1fr)}.bcviz{grid-template-columns:1fr}}
/* To-be: assumption cards, assets with AI, the tier matrix */
.tcards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-top:18px}
.tcard{grid-column:span 2}
.tcard:nth-child(n+4){grid-column:span 3}
@media (max-width:900px){.tcards{grid-template-columns:1fr}.tcard,.tcard:nth-child(n+4){grid-column:auto}}
.tcard{border:1px solid var(--card);border-radius:14px;padding:12px 14px 10px}
.tcard h4{font:700 13px/18px var(--display);color:var(--ink);margin-bottom:6px}
.tcard .af{grid-template-columns:1fr 70px 64px}
.tcard table.rc th:first-child,.tcard table.rc td:first-child{padding-left:0}
.tcard table.rc td,.tcard table.rc th{height:30px}
.tcard table.rc thead th{position:static}
.tcard table.rc tbody td{border-bottom:0;font-size:12px;color:var(--second);font-weight:400}
table.ta td .rowcell select.sz{margin-left:auto;min-width:0;width:auto;font-size:11px;color:var(--tert);border:1px solid var(--line);border-radius:999px;padding:0 18px 0 8px;height:20px}
.by{display:inline-block;padding:1px 8px;border-radius:999px;font:700 11px/16px var(--display)}
.by-a{background:#fff;box-shadow:inset 0 0 0 1px #6B6E65;color:var(--ink)}
.by-i{background:#ECEDE6;color:var(--second)}
.by-n{background:none;border:1px dashed rgba(28,29,28,.4);color:var(--tert)}
td.rate s{text-decoration:none;color:var(--tert);font-weight:400;margin:0 5px}
td.rate .ai,td.n .ai{color:var(--save)}
td.sv span{display:inline-block;min-width:46px;padding:2px 7px;border-radius:6px;text-align:center}
table.tm th.c,table.tm td.c{text-align:center}
table.tm input[type=checkbox]{accent-color:var(--save);width:15px;height:15px;cursor:pointer}
table.tm tr.sect td{font:700 12px/16px var(--display)}
table.rc td,table.rc th{height:34px}
table.rc td:first-child{display:flex;align-items:center;gap:8px;height:34px;white-space:nowrap}
.bchead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}

/* asset header */
.title{font:700 22px/28px var(--display);letter-spacing:-.015em;border:1px solid transparent;border-radius:8px;padding:0 6px;margin-left:-7px;background:none;width:100%}

/* info tip */

/* toast */
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);opacity:0;background:var(--ink);color:#fff;border-radius:999px;padding:7px 8px 7px 16px;font-size:12px;display:flex;gap:10px;align-items:center;transition:opacity .2s var(--ease),transform .25s var(--ease);z-index:90;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{border:0;background:var(--pale);color:var(--ink);border-radius:999px;padding:3px 10px;font:700 11px/16px var(--display)}

@media (prefers-reduced-motion:reduce){*{transition-duration:.001ms!important}}
@media (max-width:1080px){.grid{grid-template-columns:1fr}.askcol{position:static;max-height:none}.wrap{padding:0 20px}}
@media (max-width:720px){.three{grid-template-columns:1fr}.headline .n{font-size:40px}.stamp,.saved{display:none}.wfrow{grid-template-columns:96px 1fr 70px}}
@media print{
  @page{size:A4 landscape;margin:12mm}
  header.site,.askcol,.acts,tr.add,.pillrow,.info,.grip,#toast,#tip{display:none!important}
  .grid,.grid.wide{grid-template-columns:1fr}
  .tscroll{max-height:none;overflow:visible}
  .hero::before,.stack i,.grow .t b,.chip{print-color-adjust:exact;-webkit-print-color-adjust:exact}
  thead{display:table-header-group} tr{break-inside:avoid}
  .num{background:none}
