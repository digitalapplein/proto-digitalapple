<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RCA Analytics Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* tokens read from the Vodafone Figma file 'VF ROI Calculator' (Results 1 year) */
  --red:#E60000; --red-deep:#BD0000; --red-10:rgba(230,0,0,.1); --ink:#25282B; --ink-2:#383B40; --muted:#494C4E; --faint:#7C7F82;
  --line:#E6EAEE; --line-2:#B6B7B8; --chip:#C3C8CC; --wash:#F6F6F6; --white:#fff;
  --aqua:#00B0CA; --plum:#5E2750; --green:#0B7A4B; --amber:#A85A00;
  --r:4px; --shadow:0 2px 8px rgba(0,0,0,.10),0 8px 24px rgba(0,0,0,.06);
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--white);color:var(--ink);font:400 14px/1.45 Figtree,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
::selection{background:var(--red);color:#fff}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:3px}
.sidebar :focus-visible{outline-color:#fff}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* shell */
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.sidebar{background:var(--ink);color:#fff;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;padding:20px 14px 16px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 10px 22px}
.mark{width:34px;height:34px;border-radius:50%;background:var(--red);display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:-.02em}
.brand b{display:block;font-weight:600;font-size:15px;line-height:1.1}
.brand span{font-size:12px;color:#B8B8B8}
.pf{margin-top:8px}
.pf-h{display:flex;align-items:center;gap:10px;padding:10px 10px 6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#B8B8B8}
.pf-h .tag{margin-left:auto;font-size:11px;letter-spacing:.02em;text-transform:none;border:1px solid #555;border-radius:20px;padding:1px 8px;color:#DADADA;font-weight:500}
.nav{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;color:#E8E8E8;text-align:left;padding:8px 10px 8px 38px;border-radius:var(--r);font-size:14px;position:relative}
.nav:hover{background:rgba(255,255,255,.07)}
.nav[aria-current=true]{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
.nav[aria-current=true]::before{content:"";position:absolute;left:19px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--red)}
.nav .n{margin-left:auto;font-size:12px;color:#B8B8B8}
.nav .dot{width:7px;height:7px;border-radius:50%;flex:none}
.side-foot{margin-top:auto;padding:18px 10px 0;border-top:1px solid #2c2c2c}
.side-foot label{display:block;font-size:12px;color:#B8B8B8;margin-bottom:6px}
.side-foot select{width:100%;background:#1b1b1b;color:#fff;border:1px solid #444;border-radius:var(--r);padding:9px 10px}
.side-foot p{margin:10px 0 0;font-size:12px;color:#9a9a9a}

.main{min-width:0;background:var(--wash)}
.top{display:flex;align-items:center;gap:12px;padding:0 32px;height:56px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:5}
.menu-btn{display:none;border:1px solid var(--line-2);background:#fff;border-radius:var(--r);padding:6px}
.crumb{color:var(--muted);font-size:13px;display:flex;gap:8px;align-items:center}
.crumb b{color:var(--ink);font-weight:600}
.sample{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);background:var(--wash);border-radius:20px;padding:5px 12px}
.sample i{width:7px;height:7px;border-radius:50%;background:var(--amber)}

.page{padding:28px 32px 56px;max-width:1440px}
.head{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between}
h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.01em;line-height:1.15;color:var(--red)}
.sub{margin:6px 0 0;color:var(--muted)}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;gap:8px}
.seg button{border:1px solid var(--chip);background:#fff;padding:6px 14px;border-radius:100px;font-size:13px;color:var(--muted);transition:border-color .15s}
.seg button:hover{border-color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.btn{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line-2);background:#fff;border-radius:var(--r);padding:8px 14px;font-weight:500;font-size:13px;transition:background .15s,border-color .15s}
.btn:hover{background:var(--wash);border-color:var(--faint)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.btn.primary:hover{background:var(--red-deep);border-color:var(--red-deep)}
.btn.sm{padding:5px 10px;font-size:12px}

.tabs{display:flex;gap:36px;margin:24px 0 0;border-bottom:1px solid var(--line-2);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 4px 14px;color:var(--ink-2);font-weight:400;font-size:17px;letter-spacing:.01em;position:relative;white-space:nowrap}
.tabs button:hover{color:var(--red)}
.tabs button[aria-selected=true]{color:var(--red);font-weight:700}
.tabs button[aria-selected=true]::after{content:"";position:absolute;left:-6px;right:-6px;bottom:-1px;height:4px;background:var(--red);border-radius:2px 2px 0 0}

.sec{margin-top:24px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 14px}
h2{margin:0;font-size:18px;font-weight:700;letter-spacing:.01em;color:var(--ink)}
.note{color:var(--muted);font-size:13px}
.grid{display:grid;gap:24px;margin-top:24px}
.grid>section,.sec,.funnel{background:#fff;border:1px solid var(--line-2);border-radius:var(--r)}
.grid>section,.sec{padding:22px 24px}
.g-2-1{grid-template-columns:minmax(0,1.9fr) minmax(0,1fr)}
.g-1-1{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid>section{min-width:0}
.grid .sec-h{margin-bottom:12px}

/* funnel */
.funnel{margin-top:24px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));overflow:hidden}
.stage{padding:22px 22px 20px;position:relative}
.stage+.stage::before{content:"";position:absolute;left:0;top:22px;bottom:22px;width:1px;background:var(--line)}
.stage.hl{background:var(--red-10)}
.stage.hl .fig{color:var(--red)}
.stage .lab{color:var(--ink);font-size:14px;font-weight:700}
.stage .fig{font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-top:8px}
.stage .rate{margin-top:6px;font-size:13px;color:var(--ink-2);min-height:20px}
.stage .rate b{font-weight:600}
.stage .bar{height:6px;background:var(--line);border-radius:3px;margin-top:14px;overflow:hidden}
.stage .bar i{display:block;height:100%;background:var(--ink);border-radius:3px;width:0;transition:width .9s var(--ease)}
.stage.hl .bar i{background:var(--red)}
.cover{margin:10px 2px 0;font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center}

/* chart */
.chart{position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:6px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;gap:8px;align-items:center}
.legend i{width:12px;height:3px;border-radius:2px;display:inline-block}
.legend i.sq{height:10px;width:10px;border-radius:2px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;border-radius:var(--r);padding:9px 12px;font-size:12.5px;line-height:1.5;box-shadow:var(--shadow);opacity:0;transition:opacity .12s;white-space:nowrap;z-index:3}
.tip b{display:block;font-weight:600;margin-bottom:2px}

/* bar lists */
.bl{display:grid;gap:14px}
.bl-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline}
.bl-row .t{height:8px;background:var(--line);border-radius:4px;grid-column:1/-1;overflow:hidden}
.bl-row .t i{display:block;height:100%;background:var(--ink);border-radius:4px;width:0;transition:width .9s var(--ease)}
.bl-row.red .t i{background:var(--red)}
.bl-row .v{font-weight:600}
.bl-row .v small{font-weight:400;color:var(--muted);margin-left:6px}

/* table */
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:680px}
th{font-size:13px;font-weight:700;color:var(--red);text-align:right;padding:0 10px 10px;white-space:nowrap;letter-spacing:.01em}
th:first-child,td:first-child{text-align:left;padding-left:0}
th.l,td.l{text-align:left}
td{height:46px;padding:0 10px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--wash)}
td.m{font-weight:600}
tfoot td{font-weight:600;border-top:2px solid var(--ink);background:transparent}
.cell-bar{display:inline-flex;align-items:center;gap:10px;justify-content:flex-end;width:100%}
.cell-bar .t{width:56px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.cell-bar .t i{display:block;height:100%;background:var(--ink);border-radius:3px}
.dash{color:var(--faint)}

.chip{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500}
.chip i{width:8px;height:8px;border-radius:50%;flex:none}
.chip.ok i{background:var(--green)} .chip.warn i{background:var(--amber)}
.chip.off i{background:transparent;border:1.5px solid var(--faint)}
.chip.ok{color:var(--green)} .chip.warn{color:var(--amber)} .chip.off{color:var(--muted)}

/* attention list */
.alist{list-style:none;margin:0;padding:0;display:grid;gap:0}
.alist li{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.alist li:first-child{border-top:0;padding-top:2px}
.alist svg{margin-top:1px}
.alist .w{color:var(--amber)} .alist .g{color:var(--green)} .alist .r{color:var(--red)}
.alist p{margin:0;color:var(--ink-2)} .alist b{font-weight:600;color:var(--ink)}

/* stacked pipeline */
.stack{display:flex;height:14px;border-radius:3px;overflow:hidden;gap:2px;min-width:260px}
.stack i{display:block;height:100%;min-width:2px}
.stack-off{height:14px;border:1px dashed var(--line-2);border-radius:3px;min-width:260px;display:flex;align-items:center;padding:0 8px;font-size:11.5px;color:var(--muted);white-space:nowrap}

/* columns */
.cols{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:14px;align-items:end;height:300px;padding-top:10px}
.col{display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;text-align:center}
.col .v{font-weight:600;font-size:15px;margin-bottom:6px}
.col .b{background:var(--faint);border-radius:4px 4px 0 0;height:0;transition:height .9s var(--ease)}
.col.hit .b{background:var(--red)}
.col .d{font-size:12px;color:var(--muted);margin-top:8px;min-height:18px}
.col.hit .d{color:var(--red-deep);font-weight:600}
.col .n{font-size:12.5px;color:var(--ink-2);margin-top:2px;min-height:34px;line-height:1.25}

.opt{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.5fr) auto;gap:6px 18px;padding:16px 0;border-top:1px solid var(--line);align-items:start}
.opt:first-of-type{border-top:0}
.opt h3{margin:0;font-size:15px;font-weight:600}
.opt p{margin:2px 0 0;color:var(--muted);font-size:13px}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:20px;padding:2px 10px;background:var(--wash);color:var(--ink-2)}
.pill.rec{background:var(--red);color:#fff}
.tog{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.tog:first-of-type{border-top:0}
.tog b{font-weight:600} .tog p{margin:2px 0 0;color:var(--muted);font-size:13px}
.sw{position:relative;width:42px;height:24px;border-radius:12px;border:0;background:var(--line-2);flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .25s var(--ease);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw[aria-checked=true]{background:var(--red)}
.sw[aria-checked=true]::after{transform:translateX(18px)}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:var(--r);box-shadow:var(--shadow);opacity:0;transition:opacity .2s,transform .3s var(--ease);z-index:20;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.scrim{display:none}

.dates{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.dates input{border:1px solid var(--chip);border-radius:var(--r);background:#fff;padding:6px 10px;font:inherit;color:var(--ink)}
.dates input:hover{border-color:var(--ink)}
.rank{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.rank:first-child{border-top:0;padding-top:0}
.rank.click{cursor:pointer}.rank.click:hover .qn{background:var(--red);color:#fff}
.rank b{font-weight:700}
.rank .note{display:block}
.qn{display:inline-grid;place-items:center;min-width:48px;height:30px;padding:0 10px;border-radius:100px;background:var(--red-10);color:var(--red);font-weight:700;font-size:14px;transition:background .15s,color .15s}
.qchips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 20px}
.qchip{border:1px solid var(--chip);background:#fff;border-radius:100px;padding:4px 0;min-width:48px;font-size:13px;color:var(--ink-2);transition:border-color .15s}
.qchip:hover{border-color:var(--ink)}
.qchip.warn{color:var(--red);border-color:rgba(230,0,0,.45);font-weight:700}
.qchip[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.qhead{margin:0 0 22px}
.qhead p{margin:8px 0 0;font-size:20px;font-weight:700;line-height:1.3;color:var(--ink);max-width:62ch}
.qmeta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.split{display:grid;gap:36px;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}
.sec{scroll-margin-top:72px}
.tall{max-height:460px;overflow:auto}
table.qt{min-width:760px}
table.qt thead th{position:sticky;top:0;background:#fff;z-index:1;padding-top:2px;box-shadow:0 1px 0 var(--line-2)}
table.qt td.wrap{white-space:normal;line-height:1.3;padding-top:8px;padding-bottom:8px}
table.qt tr.sel td{background:var(--red-10)}
table.heat td{height:38px;text-align:center;font-weight:600}
table.heat th{text-align:center}
table.heat th:first-child,table.heat td:first-child{text-align:left}
table.heat td.agg{border-left:1px solid var(--line-2);border-right:1px solid var(--line-2)}
@media (max-width:1180px){
  .g-2-1,.g-1-1,.g-3,.split{grid-template-columns:minmax(0,1fr)}
  .funnel{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stage:nth-child(4)::before{display:none}
  .stage:nth-child(n+4){border-top:1px solid var(--line)}
}
@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;z-index:30;left:0;top:0;width:280px;transform:translateX(-100%);transition:transform .35s var(--ease)}
  body.nav-open .sidebar{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25}
  .menu-btn{display:inline-flex}
  .top{padding:0 16px} .page{padding:22px 16px 48px} .grid>section,.sec{padding:18px 16px}
  .sample span{display:none}
  .opt{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  h1{font-size:24px} .qhead p{font-size:17px}
  .funnel{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stage:nth-child(n)::before{display:none}
  .stage:nth-child(n+3){border-top:1px solid var(--line)}
  .stage:nth-child(even){border-left:1px solid var(--line)}
  .stage .fig{font-size:32px}
  .cols{gap:6px;height:220px} .col .n{font-size:11px}
  .tabs{gap:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="side" aria-label="Portfolios and markets"></aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="top">
      <button class="menu-btn" id="menu" aria-label="Open navigation"></button>
      <div class="crumb" id="crumb"></div>
      <div class="sample"><i></i><span>Mockup by Digital Apple with sample data and draft question wording. Real figures appear once each market's feed is connected.</span></div>
    </header>
    <main class="page" id="page"></main>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------- icons ---------- */
const P={
 cloud:'<path d="M7 18a4 4 0 0 1-.6-7.96A5.5 5.5 0 0 1 17 8.5a4.75 4.75 0 0 1 .5 9.5H7z"/>',
 shield:'<path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/>',
 download:'<path d="M12 4v11"/><path d="M7.5 11 12 15.5 16.5 11"/><path d="M5 19h14"/>',
 calendar:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/>',
 clock:'<circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/>',
 plug:'<path d="M9 3v5M15 3v5"/><path d="M6 8h12v3a6 6 0 0 1-12 0V8z"/><path d="M12 17v4"/>',
 upload:'<path d="M12 16V5"/><path d="M7.5 9 12 4.5 16.5 9"/><path d="M5 19h14"/>',
 alert:'<path d="M12 4 3 19h18L12 4z"/><path d="M12 10v4M12 16.5v.5"/>',
 check:'<path d="M5 12.5 10 17.5 19 7"/>',
 menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
 trend:'<path d="M4 17l5-5 4 4 7-8"/><path d="M15 8h5v5"/>',
 mail:'<rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="M4 7l8 6 8-6"/>'
};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;

/* ---------- sample data (illustrative). Question wording is draft: replace with the live RCA survey ---------- */
const ps=s=>s.split('|').map(x=>{const i=x.lastIndexOf(':');return [x.slice(0,i),+x.slice(i+1)]});
const Qn=(sec,text,type,opts)=>({sec,text,type,opts:ps(opts)});
const DATA={
 cloud:{name:'Cloud',tag:'',icon:'cloud',assessment:'Cloud Readiness Assessment',
  markets:[
   {id:'uk',name:'United Kingdom',feed:'crm',sync:'Today, 06:10',s:2400,comp:.67,lead:.35,cont:.86,won:.20,days:1.9},
   {id:'ie',name:'Ireland',feed:'crm',sync:'Today, 06:10',s:1190,comp:.74,lead:.44,cont:.91,won:.26,days:1.2},
   {id:'al',name:'Albania',feed:'upload',sync:'28 Sep 2026',s:860,comp:.66,lead:.37,cont:.71,won:.17,days:4.8}
  ],
  services:[['Cloud migration',31],['Managed hosting',24],['Hybrid connectivity',19],['Backup and disaster recovery',15],['Security add-on',11]],
  q:[
   Qn('Business',"Which best describes your organisation's cloud strategy?",'s',"No formal strategy:22|Strategy being drafted:31|Approved, early rollout:29|Cloud-first, fully adopted:18"),
   Qn('Business','What share of your workloads run in the cloud today?','s',"Under 10%:24|10 to 30%:33|30 to 60%:28|Over 60%:15"),
   Qn('Business','How is cloud spend approved and tracked?','s',"No central tracking:27|Tracked by IT only:38|Shared IT and finance review:25|Automated budgets and alerts:10"),

function weights(m){

 let seed=0;for(const c of m.key)seed+=c.charCodeAt(0);

 for(let i=0;i<NDAYS;i++){const d=dayAt(i),wd=d.getDay();

  ['Assessments started',t.started,'',t.started/t.started,false],
  ['Completed',t.completed,`<b>${pct(t.completed/t.started)}</b> of those started`,t.completed/t.started,false],
  ['Leads generated',t.leads,`<b>${pct(t.leads/t.completed)}</b> of completed`,t.leads/t.started,true],
  ['Contacted by sales',t.live?t.contacted:null,t.live?`<b>${pct(t.contacted/t.liveLeads)}</b> of leads`:'No follow-up data',t.live?t.contacted/t.started:0,false],
  ['Sold through RCA',t.live?t.won:null,t.live?`<b>${pct(t.won/t.contacted)}</b> of contacted`:'No follow-up data',t.live?t.won/t.started:0,false]
 ];
 return `<div class="funnel">${st.map(s=>`<div class="stage ${s[4]?'hl':''}"><div class="lab">${s[0]}</div><div class="fig">${fmt(s[1])}</div><div class="rate">${s[2]}</div><div class="bar"><i data-w="${Math.max(s[3]*100,s[1]?2:0).toFixed(1)}"></i></div></div>`).join('')}</div>`;
}
function attention(rows,t){
 const d=pfData(),out=[],qm=qmodel(S.pf,rows),top=topDrops(qm,1)[0];
 const gcomp=t.completed/t.started;
 const where=top.i<d.q.length?'<b>'+qLab(d,top.i)+'</b>':'the <b>details form</b>';
 if(rows.length>1){
  const low=[...rows].sort((a,b)=>a.m.comp-b.m.comp)[0];
  out.push(['alert','w',`<b>${low.m.name}</b> loses the most respondents: ${pct(low.m.comp)} finish, against ${pct(gcomp)} across the group.`]);
  out.push(['alert','w',`The biggest single drop is at ${where}: ${top.pts.toFixed(1)} pts of starters leave there.`]);
  const none=rows.filter(r=>!r.live);
  if(none.length)out.push(['plug','r',`<b>${none[0].m.name}</b> is not connected: ${fmt(none[0].completed)} completed assessments, ${fmt(none[0].leads)} leads, and no view of what happened next.`]);
  const stale=rows.filter(r=>r.m.stale);
  if(stale.length)out.push(['clock','w',`<b>${stale[0].m.name}</b> last uploaded on ${stale[0].m.sync}. Its sales figures are about two months old.`]);
  const live=rows.filter(r=>r.live);
  if(live.length){
   const best=[...live].sort((a,b)=>b.m.won-a.m.won)[0],slow=[...live].sort((a,b)=>b.m.days-a.m.days)[0];
   out.push(['trend','g',`<b>${best.m.name}</b> converts ${pct(best.m.won)} of contacted leads, the best in the group. ${best.m.days.toFixed(1)} days to first contact.`]);
   const crm=rows.filter(r=>r.m.feed==='crm');
   if(slow.m.days>3&&crm.length)out.push(['clock','w',`<b>${slow.m.name}</b> takes ${slow.m.days.toFixed(1)} days to reach a new lead. CRM-connected markets average ${(crm.reduce((a,r)=>a+r.m.days,0)/crm.length).toFixed(1)}.`]);
  }
 }else{
  const r=rows[0];
  out.push(['trend','g',`<b>${r.m.name}</b> turns ${pct(r.m.lead)} of completed assessments into leads.`]);
  if(r.live)out.push(['clock',r.m.days>3?'w':'g',`New leads wait <b>${r.m.days.toFixed(1)} days</b> for a first contact.`]);
  out.push(['alert','w',`The biggest drop is at ${where}: ${top.pts.toFixed(1)} pts of starters leave there. See Assessment insights.`]);
 }
 return `<ul class="alist">${out.slice(0,5).map(o=>`<li><span class="${o[1]}">${ic(o[0])}</span><p>${o[2]}</p></li>`).join('')}</ul>`;
}
function marketsTable(rows,t){

 ${[...rows].sort((a,b)=>b.completed-a.completed).map(r=>`<tr class="click" data-mk="${r.m.id}" tabindex="0"><td class="m">${r.m.name}</td><td>${fmt(r.completed)}</td><td><span class="cell-bar"><span class="t"><i style="width:${r.m.comp*100}%"></i></span>${pct(r.m.comp)}</span></td><td>${fmt(r.leads)}</td><td>${r.live?`${fmt(r.contacted)} <span class="note">(${pct(r.m.cont)})</span>`:fmt(null)}</td><td>${r.live?`${fmt(r.won)} <span class="note">(${pct(r.m.won)})</span>`:fmt(null)}</td><td>${r.live?r.m.days.toFixed(1):fmt(null)}</td><td class="l">${feedChip(r.m)}</td></tr>`).join('')}

}
function compareTable(rows,gt){
 const r=rows[0],d=pfData();
 const all=d.markets.map(m=>calc(m,FULL));
 const live=all.filter(x=>x.live);
 const avg=k=>live.reduce((a,x)=>a+x.m[k]*x.leads,0)/live.reduce((a,x)=>a+x.leads,0);
 const gc=all.reduce((a,x)=>a+x.completed,0)/all.reduce((a,x)=>a+x.started,0);
 const gl=all.reduce((a,x)=>a+x.leads,0)/all.reduce((a,x)=>a+x.completed,0);
 const m=[['Completion rate',r.m.comp,gc,true],['Leads from completed',r.m.lead,gl,true],['Leads contacted',r.live?r.m.cont:null,avg('cont'),true],['Sold from contacted',r.live?r.m.won:null,avg('won'),true],['Days to first contact',r.live?r.m.days:null,avg('days'),false]];
 return `<div class="scroll"><table><thead><tr><th>Measure</th><th>${r.m.name}</th><th>Group average</th><th class="l">Difference</th></tr></thead><tbody>${m.map(x=>{
  const days=x[0].startsWith('Days');const f=v=>v==null?fmt(null):days?v.toFixed(1):pct(v);
  let diff='<span class="dash">&ndash;</span>';
  if(x[1]!=null){const dv=days?x[2]-x[1]:(x[1]-x[2])*100;const good=dv>=0;diff=`<span class="chip ${Math.abs(dv)<.3?'off':good?'ok':'warn'}"><i></i>${Math.abs(dv)<.3?'In line':(days?Math.abs(dv).toFixed(1)+' days '+(good?'faster':'slower'):Math.abs(dv).toFixed(0)+' pts '+(good?'above':'below'))}</span>`}
  return `<tr><td class="m">${x[0]}</td><td>${f(x[1])}</td><td>${f(x[2])}</td><td class="l">${diff}</td></tr>`}).join('')}</tbody></table></div>`;
}

function heatTable(rowNames,rows,getv,aggv,cap){
 const mx=Math.max(.01,...rowNames.flatMap((n,i)=>rows.map((r,ri)=>getv(ri,i)||0)));
 const cell=v=>v==null?`<td class="dash">&ndash;</td>`:`<td style="background:rgba(230,0,0,${(.07+.34*v/mx).toFixed(2)})">${(v*100).toFixed(0)}%</td>`;
 return `<div class="scroll"><table class="heat" style="min-width:${cap||420}px"><thead><tr><th>Option</th>${rows.length>1?'<th>All</th>':''}${rows.map(r=>`<th>${r.m.name}</th>`).join('')}</tr></thead><tbody>
 ${rowNames.map((n,i)=>`<tr><td class="m" style="white-space:normal;line-height:1.25;padding-top:8px;padding-bottom:8px">${n}</td>${rows.length>1?cell(aggv[i]).replace('<td','<td class="agg"'):''}${rows.map((r,ri)=>cell(getv(ri,i))).join('')}</tr>`).join('')}
 </tbody></table></div>`;
}

  h+=`<div class="pf"><div class="pf-h">${ic(d.icon)}<span>${d.name}</span>${d.tag?`<span class="tag">${d.tag}</span>`:''}</div>`;
  if(!r.mk)h+=`<button class="nav" data-pf="${key}" data-mk="all" aria-current="${S.pf===key&&S.mk==='all'}">All markets<span class="n">${d.markets.length}</span></button>`;
  ms.forEach(m=>{h+=`<button class="nav" data-pf="${key}" data-mk="${m.id}" aria-current="${S.pf===key&&S.mk===m.id}"><span class="dot" style="background:${m.feed==='crm'?'#3DBE7F':m.feed==='upload'?'#E8A33A':'transparent;border:1.5px solid #888'}"></span>${m.name}<span class="n">${fmt(calc(m,rg).completed)}</span></button>`});
  h+=`</div>`;
 });
 h+=`<div class="side-foot"><label for="role">Preview as</label><select id="role">${Object.entries(ROLES).map(([k2,v])=>`<option value="${k2}" ${S.role===k2?'selected':''}>${v.label}</option>`).join('')}</select><p>Each person sees only the portfolios and markets they are allowed to. Switch the preview to see it. Numbers beside markets are completed assessments in the date range.</p></div>`;
 $('#side').innerHTML=h;
}
function render(){
 const d=pfData(),m=d.markets.find(x=>x.id===S.mk),r=rng();
 sidebar();
 $('#menu').innerHTML=ic('menu');
 $('#crumb').innerHTML=`<span>${d.name}</span><span>/</span><b>${S.mk==='all'?'All markets':m.name}</b>`;
 $('#page').innerHTML=`
  <div class="head"><div><h1>${d.name}${S.mk==='all'?'':` &middot; ${m.name}`}</h1><p class="sub">${d.assessment}${S.mk==='all'?` &middot; ${d.markets.length} markets`:''} &middot; ${rngLabel()} (${r.n} days)</p></div>
   <div class="ctl"><div class="seg" role="group" aria-label="Date range">${[7,30,90,365].map(p=>`<button data-p="${p}" aria-pressed="${S.preset===String(p)}">${p===365?'12 months':p+' days'}</button>`).join('')}<button data-p="custom" aria-pressed="${S.preset==='custom'}">Custom</button></div>
    <div class="dates"><label for="dfrom">From</label><input type="date" id="dfrom" value="${S.from}" min="${iso(D0)}" max="${iso(D1)}"><label for="dto">To</label><input type="date" id="dto" value="${S.to}" min="${iso(D0)}" max="${iso(D1)}"></div>
    <button class="btn" data-toast="Mockup: downloads this view as a PDF">${ic('download')}Export PDF</button>
    <button class="btn primary" data-toast="Mockup: opens the report schedule">${ic('calendar')}Schedule report</button></div></div>
  <div class="tabs" role="tablist">${TABS.map(t=>`<button role="tab" data-tab="${t[0]}" aria-selected="${S.tab===t[0]}">${t[1]}</button>`).join('')}</div>
  <div id="body">${TABS.find(t=>t[0]===S.tab)[2]()}</div>`;
 drawCharts();
 animate($('#page'));
}
function drawCharts(){
 const rows=scoped(),d=pfData();
 const tr=$('#trend');
 if(tr){const t=trend(rows);lineChart(tr,[{n:'Completed assessments',c:'#25282B',v:t.comp},{n:'Leads generated',c:'#E60000',v:t.leads}],t.labs)}
 const ql=$('#qleave'),qs=$('#qsurv');
 if(ql||qs){
  const m=qmodel(S.pf,rows),labs=m.drop.map((x,i)=>({s:qLab(d,i),l:qLab(d,i)+' · '+qSec(d,i)}));
  const hi=new Set(topDrops(m,3).map(x=>x.i));
  if(ql)barChart(ql,m.drop.map(x=>+(x*100).toFixed(2)),labs,hi,i=>`<b>${qLab(d,i)} · ${qSec(d,i)}</b>${(m.drop[i]*100).toFixed(1)} pts of starters leave here<br>${(m.reach[i]*100).toFixed(0)}% reached it`);
  if(qs)lineChart(qs,[{n:'Still answering',c:'#E60000',v:m.reach.map(x=>+(x*100).toFixed(1))}],labs,'%');
 }
}
function go(p){Object.assign(S,p);const y=window.scrollY;render();window.scrollTo(0,y)}
function openQ(n){go({q:+n,tab:'insights'});const a=document.getElementById('answers');if(a)a.scrollIntoView({behavior:'smooth',block:'start'})}
document.addEventListener('click',e=>{
 const nav=e.target.closest('[data-pf]');if(nav){go({pf:nav.dataset.pf,mk:nav.dataset.mk,q:1});document.body.classList.remove('nav-open');return}
 const tab=e.target.closest('[data-tab]');if(tab){go({tab:tab.dataset.tab});return}
 const per=e.target.closest('[data-p]');if(per){const v=per.dataset.p;if(v==='custom')S.preset='custom';else setPreset(+v);go({});return}
 const qq=e.target.closest('[data-q]');if(qq){openQ(qq.dataset.q);return}
 const row=e.target.closest('tr[data-mk]');if(row){go({mk:row.dataset.mk,tab:S.tab==='feed'?'feed':'overview',q:1});window.scrollTo(0,0);return}
 const sw=e.target.closest('.sw');if(sw){sw.setAttribute('aria-checked',sw.getAttribute('aria-checked')!=='true');return}
 const ts=e.target.closest('[data-toast]');if(ts){toast(ts.dataset.toast);return}
 if(e.target.closest('#menu'))document.body.classList.add('nav-open');
 if(e.target.id==='scrim')document.body.classList.remove('nav-open');
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-mk],tr[data-q],.rank[data-q]')){e.preventDefault();e.target.click()}});
document.addEventListener('change',e=>{
 if(e.target.id==='role'){S.role=e.target.value;const r=ROLES[S.role];if(!r.pf.includes(S.pf))S.pf=r.pf[0];S.mk=r.mk?r.mk[0]:'all';S.q=1;render();return}
 if(e.target.id==='dfrom'||e.target.id==='dto'){
  let a=$('#dfrom').value,b=$('#dto').value;if(!a||!b)return;
  const lo=iso(D0),hi=iso(D1);a=a<lo?lo:a>hi?hi:a;b=b<lo?lo:b>hi?hi:b;
  if(a>b){if(e.target.id==='dfrom')b=a;else a=b}
  S.from=a;S.to=b;S.preset='custom';go({});
 }
});
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2400)}
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(drawCharts,120)});
render();
</script>
</body>
</html>
