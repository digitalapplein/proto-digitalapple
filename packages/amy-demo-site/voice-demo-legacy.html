<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --bg: #0d0d12;
    --surface: #1a1a24;
    --surface2: #242432;
    --surface3: #2e2e3e;
    --border: #2e2e3e;
    --border-soft: #1f1f2e;
    --text-primary: #f0f0f5;
    --text-secondary: #9898a8;
    --text-tertiary: #5e5e72;
    --amy-green: #24C887;
    --amy-green-dim: rgba(36, 200, 135, 0.15);
    --amy-green-glow: rgba(36, 200, 135, 0.3);
    --amber: #ffa710;
    --amber-dim: rgba(255, 167, 16, 0.15);
    --violet: #a594fd;
    --violet-dim: rgba(165, 148, 253, 0.15);
    --r-sm: 8px;
    --r-md: 12px;
    --r-lg: 16px;
    --r-full: 9999px;
    --font: 'Geist', system-ui, sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ─── TOPBAR ─── */
  .topbar {
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    border-bottom: 1px solid var(--border-soft);
    background: rgba(13,13,18,0.9);
    backdrop-filter: blur(12px);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .topbar-brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .topbar-logo {
    width: 28px; height: 28px;
    background: var(--amy-green);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 14px; color: #0d0d12;
  }
  .topbar-title {
    font-size: 15px; font-weight: 500; letter-spacing: -0.01em;
  }
  .topbar-badge {
    font-size: 11px; font-weight: 500;
    padding: 3px 10px;
    border-radius: var(--r-full);
    background: var(--amy-green-dim);
    color: var(--amy-green);
    border: 1px solid rgba(36,200,135,0.2);
  }
  .topbar-actions {
    display: flex; align-items: center; gap: 12px;
  }

  /* ─── STATUS BAR (thinking/action indicator) ─── */
  .status-bar {
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--surface);
    border-bottom: 1px solid var(--border-soft);
    font-size: 13px;
    color: var(--text-secondary);
    transition: all 0.3s ease;
    overflow: hidden;
  }
  .status-bar.active {
    background: var(--amy-green-dim);
    color: var(--amy-green);
    border-color: rgba(36,200,135,0.15);
  }
  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text-tertiary);
    transition: background 0.3s ease;
  }
  .status-bar.active .status-dot {
    background: var(--amy-green);
    animation: pulse-dot 1.5s ease infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.4); }
  }

  /* ─── MAIN LAYOUT ─── */
  .main-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    height: calc(100vh - 96px);
  }

  /* ─── PANEL ─── */
  .panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  .panel:first-child {
    border-right: 1px solid var(--border-soft);
  }
  .panel-header {
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    border-bottom: 1px solid var(--border-soft);
    background: var(--surface);
    flex-shrink: 0;
  }
  .panel-label {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-tertiary);
  }
  .panel-label-icon {
    width: 16px; height: 16px;
    opacity: 0.6;
  }
  .panel-info {
    font-size: 12px; color: var(--text-tertiary);
  }

  /* ─── PDF VIEWER ─── */
  .pdf-container {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
    background: var(--bg);
    scroll-behavior: smooth;
  }
  .pdf-canvas-wrap {
    margin-bottom: 16px;
    border-radius: var(--r-md);
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    transition: box-shadow 0.5s ease, outline 0.5s ease;
    outline: 2px solid transparent;
    outline-offset: 4px;
  }
  .pdf-canvas-wrap.highlighted {
    outline-color: var(--amy-green);
    box-shadow: 0 4px 24px rgba(36,200,135,0.2);
  }
  .pdf-canvas-wrap canvas {
    display: block;
    max-width: 100%;
    height: auto;
  }
  .pdf-page-label {
    font-size: 11px;
    color: var(--text-tertiary);
    margin-bottom: 8px;
    font-weight: 500;
    letter-spacing: 0.04em;
  }

  /* ─── PDF THUMBNAIL STRIP ─── */
  .pdf-thumbs {
    display: flex;
    gap: 8px;
    padding: 12px 20px;
    overflow-x: auto;
    background: var(--surface);
    border-top: 1px solid var(--border-soft);
    flex-shrink: 0;
  }
  .pdf-thumb {
    width: 48px; height: 64px;
    border-radius: 6px;
    overflow: hidden;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.2s ease;
    opacity: 0.5;
    flex-shrink: 0;
    background: var(--surface2);
    position: relative;
  }
  .pdf-thumb.active {
    border-color: var(--amy-green);
    opacity: 1;
  }
  .pdf-thumb:hover { opacity: 0.8; }
  .pdf-thumb canvas {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .pdf-thumb-num {
    position: absolute;
    bottom: 2px; right: 3px;
    font-size: 9px; font-weight: 600;
    color: var(--text-primary);
    background: rgba(0,0,0,0.6);
    padding: 1px 4px;
    border-radius: 3px;
  }

  /* ─── VIDEO PLAYER ─── */
  .video-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #000;
    position: relative;
  }
  .video-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .video-wrap video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    transition: opacity 0.3s ease;
  }

  /* Video overlay for transitions */
  .video-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
    z-index: 5;
  }
  .video-overlay.visible {
    opacity: 1;
    pointer-events: auto;
  }
  .video-overlay-text {
    font-size: 18px;
    font-weight: 300;
    letter-spacing: -0.02em;
    color: var(--text-primary);
    margin-top: 16px;
  }
  .video-overlay-sub {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 6px;
  }
  .spinner {
    width: 32px; height: 32px;
    border: 2px solid var(--surface3);
    border-top-color: var(--amy-green);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ─── VIDEO CHAPTER STRIP ─── */
  .video-chapters {
    display: flex;
    gap: 4px;
    padding: 12px 20px;
    overflow-x: auto;
    background: var(--surface);
    border-top: 1px solid var(--border-soft);
    flex-shrink: 0;
  }
  .video-chapter {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    border-radius: var(--r-sm);
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.2s ease;
    min-width: 100px;
    flex-shrink: 0;
  }
  .video-chapter:hover {
    background: var(--surface2);
  }
  .video-chapter.active {
    background: var(--amy-green-dim);
    border-color: rgba(36,200,135,0.2);
  }
  .video-chapter-thumb {
    width: 80px; height: 45px;
    border-radius: 6px;
    background: var(--surface2);
    overflow: hidden;
    position: relative;
  }
  .video-chapter-thumb img {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .video-chapter-time {
    position: absolute;
    bottom: 2px; right: 3px;
    font-size: 9px; font-weight: 600;
    background: rgba(0,0,0,0.7);
    color: #fff;
    padding: 1px 5px;
    border-radius: 3px;
  }
  .video-chapter-label {
    font-size: 11px;
    color: var(--text-secondary);
    text-align: center;
    white-space: nowrap;
    font-weight: 500;
  }
  .video-chapter.active .video-chapter-label {
    color: var(--amy-green);
  }

  /* ─── DROP ZONE ─── */
  .drop-zone {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px;
    text-align: center;
    border: 2px dashed var(--border);
    margin: 24px;
    border-radius: var(--r-lg);
    transition: all 0.3s ease;
    cursor: pointer;
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--amy-green);
    background: var(--amy-green-dim);
  }
  .drop-icon {
    width: 48px; height: 48px;
    margin-bottom: 16px;
    opacity: 0.4;
  }
  .drop-title {
    font-size: 16px; font-weight: 500;
    margin-bottom: 6px;
    color: var(--text-primary);
  }
  .drop-sub {
    font-size: 13px;
    color: var(--text-tertiary);
  }
  .drop-zone input[type="file"] {
    display: none;
  }

  /* ─── MIC BUTTON (custom, shown alongside widget) ─── */
  .mic-indicator {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 20px 10px 14px;
    background: rgba(26,26,36,0.95);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: var(--r-full);
    z-index: 50;
    transition: all 0.3s ease;
  }
  .mic-indicator.listening {
    border-color: var(--amy-green);
    box-shadow: 0 0 24px rgba(36,200,135,0.15);
  }
  .mic-orb {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: background 0.3s ease;
  }
  .mic-indicator.listening .mic-orb {
    background: var(--amy-green);
  }
  .mic-orb::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 2px solid transparent;
    transition: border-color 0.3s ease;
  }
  .mic-indicator.listening .mic-orb::after {
    border-color: var(--amy-green);
    animation: mic-ring 2s ease infinite;
  }
  @keyframes mic-ring {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.3); opacity: 0; }
  }
  .mic-orb svg {
    width: 16px; height: 16px;
    color: var(--text-secondary);
    transition: color 0.3s ease;
  }
  .mic-indicator.listening .mic-orb svg { color: #0d0d12; }
  .mic-label {
    font-size: 13px;
    color: var(--text-secondary);
    font-weight: 400;
    transition: color 0.3s ease;
  }
  .mic-indicator.listening .mic-label { color: var(--amy-green); }

  /* ─── ANIMATIONS ─── */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .animate-in { animation: fadeIn 0.3s ease forwards; }
  .animate-slide { animation: slideUp 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; }

  /* Smooth page transition flash */
  .page-transition {
    position: absolute;
    inset: 0;
    background: var(--amy-green);
    opacity: 0;
    pointer-events: none;
    z-index: 10;
  }
  .page-transition.flash {
    animation: transitionFlash 0.6s ease forwards;
  }
  @keyframes transitionFlash {
    0%   { opacity: 0; }
    15%  { opacity: 0.08; }
    100% { opacity: 0; }
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }
</style>
</head>

// ═══════════════════════════════════════════════════════════════
// PDF VIEWER ENGINE
// ═══════════════════════════════════════════════════════════════

let pdfDoc = null;
let pdfPages = [];
let currentPdfPage = 1;

pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

async function loadPDF(file) {
  const arrayBuffer = await file.arrayBuffer();
  pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  
  document.getElementById('pdfDropZone').style.display = 'none';
  document.getElementById('pdfContainer').style.display = 'flex';
  document.getElementById('pdfThumbs').style.display = 'flex';
  document.getElementById('pdfInfo').textContent = `${pdfDoc.numPages} pages`;

  // Render all pages
  const container = document.getElementById('pdfContainer');
  container.innerHTML = '';
  pdfPages = [];

  for (let i = 1; i <= pdfDoc.numPages; i++) {
    const page = await pdfDoc.getPage(i);
    const scale = 1.5;
    const viewport = page.getViewport({ scale });

    const label = document.createElement('div');
    label.className = 'pdf-page-label';
    label.textContent = CONTENT_MAP.pdf[i]?.label || `Page ${i}`;

    const wrap = document.createElement('div');
    wrap.className = 'pdf-canvas-wrap';
    wrap.id = `pdf-page-${i}`;
    wrap.dataset.page = i;

    const canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    canvas.style.width = '100%';
    canvas.style.height = 'auto';

    wrap.appendChild(canvas);
    container.appendChild(label);
    container.appendChild(wrap);
    pdfPages.push(wrap);

    const ctx = canvas.getContext('2d');
    await page.render({ canvasContext: ctx, viewport }).promise;
  }

  // Render thumbnails
  renderPdfThumbnails();
}

async function renderPdfThumbnails() {
  const thumbStrip = document.getElementById('pdfThumbs');
  thumbStrip.innerHTML = '';

  for (let i = 1; i <= pdfDoc.numPages; i++) {
    const page = await pdfDoc.getPage(i);
    const thumbScale = 0.15;
    const viewport = page.getViewport({ scale: thumbScale });

    const thumb = document.createElement('div');
    thumb.className = `pdf-thumb ${i === 1 ? 'active' : ''}`;
    thumb.dataset.page = i;
    thumb.onclick = () => navigatePdf(i);

    const canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    thumb.appendChild(canvas);

    const numLabel = document.createElement('div');
    numLabel.className = 'pdf-thumb-num';
    numLabel.textContent = i;
    thumb.appendChild(numLabel);

    thumbStrip.appendChild(thumb);

    const ctx = canvas.getContext('2d');
    await page.render({ canvasContext: ctx, viewport }).promise;
  }
}

function navigatePdf(pageNumber) {
  if (!pdfDoc || pageNumber < 1 || pageNumber > pdfDoc.numPages) return;

  currentPdfPage = pageNumber;
  const target = document.getElementById(`pdf-page-${pageNumber}`);
  if (!target) return;

  // Flash transition
  const transition = document.getElementById('pdfTransition');
  transition.classList.remove('flash');
  void transition.offsetWidth;
  transition.classList.add('flash');

  // Scroll to page
  target.scrollIntoView({ behavior: 'smooth', block: 'center' });

  // Highlight
  document.querySelectorAll('.pdf-canvas-wrap').forEach(w => w.classList.remove('highlighted'));
  target.classList.add('highlighted');
  setTimeout(() => target.classList.remove('highlighted'), 3000);

  // Update thumbs
  document.querySelectorAll('.pdf-thumb').forEach(t => {
    t.classList.toggle('active', parseInt(t.dataset.page) === pageNumber);
  });

  // Update status
  const label = CONTENT_MAP.pdf[pageNumber]?.label || `Page ${pageNumber}`;
  updateStatus(`Showing: ${label} (Page ${pageNumber})`, true);
  setTimeout(() => updateStatus('Ready — speak to navigate', false), 3000);

  return `Navigated to page ${pageNumber}: ${label}`;
}


// ═══════════════════════════════════════════════════════════════
// VIDEO PLAYER ENGINE
// ═══════════════════════════════════════════════════════════════

let videoChaptersList = [];

function loadVideo(file) {
  const video = document.getElementById('demoVideo');
  const url = URL.createObjectURL(file);
  video.src = url;

  document.getElementById('videoDropZone').style.display = 'none';
  document.getElementById('videoContainer').style.display = 'flex';
  document.getElementById('videoChapters').style.display = 'flex';
  document.getElementById('videoInfo').textContent = file.name;

  video.addEventListener('loadedmetadata', () => {
    document.getElementById('videoInfo').textContent = 
      `${file.name} · ${formatTime(video.duration)}`;
    renderVideoChapters();
  });

  // Track active chapter during playback
  video.addEventListener('timeupdate', () => {
    updateActiveChapter(video.currentTime);
  });
}

function renderVideoChapters() {
  const strip = document.getElementById('videoChapters');
  strip.innerHTML = '';
  videoChaptersList = Object.entries(CONTENT_MAP.video)
    .map(([ts, data]) => ({ timestamp: parseInt(ts), ...data }))
    .sort((a, b) => a.timestamp - b.timestamp);

  videoChaptersList.forEach((ch, idx) => {
    const chEl = document.createElement('div');
    chEl.className = `video-chapter ${idx === 0 ? 'active' : ''}`;
    chEl.dataset.timestamp = ch.timestamp;
    chEl.onclick = () => navigateVideo(ch.timestamp);

    chEl.innerHTML = `
      <div class="video-chapter-thumb">
        <div style="width:100%;height:100%;background:var(--surface2);display:flex;align-items:center;justify-content:center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="1.5">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
        </div>
        <div class="video-chapter-time">${formatTime(ch.timestamp)}</div>
      </div>
      <div class="video-chapter-label">${ch.label}</div>
    `;
    strip.appendChild(chEl);
  });
}

function navigateVideo(timestamp) {
  const video = document.getElementById('demoVideo');
  if (!video.src) return;

  // Show overlay briefly for smooth transition
  const overlay = document.getElementById('videoOverlay');
  const chapter = findChapterAt(timestamp);
  document.getElementById('overlayText').textContent = chapter?.label || 'Navigating...';
  document.getElementById('overlaySub').textContent = chapter?.description || '';
  overlay.classList.add('visible');

  // Transition flash
  const transition = document.getElementById('videoTransition');
  transition.classList.remove('flash');
  void transition.offsetWidth;
  transition.classList.add('flash');

  // Seek
  video.currentTime = timestamp;
  video.play();

  // Hide overlay after brief display
  setTimeout(() => overlay.classList.remove('visible'), 800);

  // Update status
  updateStatus(`Playing: ${chapter?.label || formatTime(timestamp)}`, true);
  setTimeout(() => updateStatus('Ready — speak to navigate', false), 3000);

  // Update active chapter
  updateActiveChapter(timestamp);

  return `Video navigated to ${formatTime(timestamp)}: ${chapter?.label}`;
}

function updateActiveChapter(currentTime) {
  let activeTs = 0;
  for (const ch of videoChaptersList) {
    if (currentTime >= ch.timestamp) activeTs = ch.timestamp;
  }
  document.querySelectorAll('.video-chapter').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.timestamp) === activeTs);
  });
}

function findChapterAt(timestamp) {
  return videoChaptersList.find(ch => ch.timestamp === timestamp) ||
    videoChaptersList.reduce((closest, ch) =>
      Math.abs(ch.timestamp - timestamp) < Math.abs(closest.timestamp - timestamp) ? ch : closest
    , videoChaptersList[0]);
}

function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}


// ═══════════════════════════════════════════════════════════════
// STATUS & UI HELPERS
// ═══════════════════════════════════════════════════════════════

function updateStatus(text, active) {
  const bar = document.getElementById('statusBar');
  document.getElementById('statusText').textContent = text;
  bar.classList.toggle('active', active);
}

function setMicState(listening) {
  const mic = document.getElementById('micIndicator');
  mic.classList.toggle('listening', listening);
  document.getElementById('micLabel').textContent = listening
    ? 'Listening...'
    : 'Say something to navigate';
}


// ═══════════════════════════════════════════════════════════════
// ELEVENLABS CLIENT TOOLS REGISTRATION
// ─── This is the critical integration piece ───
// ═══════════════════════════════════════════════════════════════

// Per ElevenLabs official docs, client tools are registered by listening
// to 'elevenlabs-convai:call' (fires when a conversation session starts)
// and setting event.detail.config.clientTools = { ... } inside that handler.
function registerClientTools() {
  const widget = document.querySelector('elevenlabs-convai');
  if (!widget) {
    console.warn('ElevenLabs widget not found. Retrying in 1s...');
    setTimeout(registerClientTools, 1000);
    return;
  }

  // Fires once per conversation session — inject all tool handlers here
  widget.addEventListener('elevenlabs-convai:call', (event) => {
    console.log('[Amy Demo] Conversation started — registering 8 client tools');

    event.detail.config.clientTools = {

      navigate_pdf: ({ page_number }) => {
        console.log('[Client Tool] navigate_pdf', page_number);
        return navigatePdf(parseInt(page_number));
      },

      navigate_video: ({ timestamp }) => {
        console.log('[Client Tool] navigate_video', timestamp);
        return navigateVideo(parseFloat(timestamp));
      },

      highlight_section: ({ section }) => {
        console.log('[Client Tool] highlight_section', section);
        const panelId = section === 'pdf' ? 'pdfPanel' : 'videoPanel';
        const panel = document.getElementById(panelId);
        if (panel) {
          panel.scrollIntoView({ behavior: 'smooth' });
          updateStatus(`Focus: ${section.toUpperCase()} panel`, true);
          setTimeout(() => updateStatus('Ready — speak to navigate', false), 2000);
        }
        return `Highlighted ${section} panel`;
      },

      get_current_state: () => {
        console.log('[Client Tool] get_current_state');
        const video = document.getElementById('demoVideo');
        return JSON.stringify({
          pdf_loaded: !!pdfDoc,
          pdf_page: currentPdfPage,
          pdf_total_pages: pdfDoc?.numPages || 0,
          video_loaded: !!(video?.src && video.src !== window.location.href),
          video_time: Math.floor(video?.currentTime || 0),
          video_duration: Math.floor(video?.duration || 0),
          video_playing: !video?.paused
        });
      },

      navigate_page: ({ page }) => {
        console.log('[Client Tool] navigate_page', page);
        const p = (page || '').toLowerCase();
        if (p === 'home') {
          window.scrollTo({ top: 0, behavior: 'smooth' });
          updateStatus('Home', true);
        } else if (p === 'brochure' || p === 'pdf') {
          const panel = document.getElementById('pdfPanel');
          if (panel) panel.scrollIntoView({ behavior: 'smooth' });
          updateStatus('Showing eBook', true);
        } else if (p === 'video' || p === 'demo') {
          const panel = document.getElementById('videoPanel');
          if (panel) panel.scrollIntoView({ behavior: 'smooth' });
          updateStatus('Showing video demo', true);
        }
        setTimeout(() => updateStatus('Ready — speak to navigate', false), 2000);
        return `Navigated to: ${page}`;
      },

      get_sitemap: () => {
        console.log('[Client Tool] get_sitemap');
        return JSON.stringify({
          pages: [
            {
              route: '/voice-demo',
              title: 'Home',
              description: 'Landing page with eBook viewer and video demo player'
            },
            {
              route: '/voice-demo/brochure',
              title: "Lumen × Meter eBook — The CIO's Guide for a Network That Just Works",
              total_pages: pdfDoc?.numPages || 13,
              chapters: Object.entries(CONTENT_MAP.pdf).map(([pg, d]) => ({
                page: parseInt(pg), label: d.label, description: d.description
              }))
            },
            {
              route: '/voice-demo/video',
              title: 'Vayu AI Cloud Platform Demo (Tata Communications) — 3:45',
              chapters: Object.entries(CONTENT_MAP.video).map(([ts, d]) => ({
                timestamp: parseInt(ts), label: d.label, description: d.description
              }))
            }
          ]
        });
      },

      find_content: ({ query }) => {
        console.log('[Client Tool] find_content', query);
        const q = (query || '').toLowerCase();
        const results = [];

        for (const [pg, d] of Object.entries(CONTENT_MAP.pdf)) {
          const score = (d.label.toLowerCase().includes(q) ? 2 : 0)
                      + (d.description.toLowerCase().includes(q) ? 1 : 0);
          if (score > 0) results.push({
            type: 'pdf', page: parseInt(pg),
            label: d.label, description: d.description,
            action: `Call navigate_pdf with page_number "${pg}"`,
            relevance: score
          });
        }

        for (const [ts, d] of Object.entries(CONTENT_MAP.video)) {
          const score = (d.label.toLowerCase().includes(q) ? 2 : 0)
                      + (d.description.toLowerCase().includes(q) ? 1 : 0);
          if (score > 0) results.push({
            type: 'video', timestamp: parseInt(ts),
            label: d.label, description: d.description,
            action: `Call navigate_video with timestamp "${ts}"`,
            relevance: score
          });
        }

        results.sort((a, b) => b.relevance - a.relevance);
        return JSON.stringify(results.slice(0, 3));
      },

      get_page_knowledge: ({ route }) => {
        console.log('[Client Tool] get_page_knowledge', route);
        const r = (route || '').toLowerCase();
        if (r.includes('brochure') || r.includes('pdf')) {
          return JSON.stringify({
            title: "Lumen × Meter eBook: The CIO's Guide for a Network That Just Works",
            total_pages: pdfDoc?.numPages || 13,
            current_page: currentPdfPage,
            pages: Object.entries(CONTENT_MAP.pdf).map(([pg, d]) => ({
              page: parseInt(pg), ...d
            }))
          });
        } else if (r.includes('video') || r.includes('demo')) {
          const video = document.getElementById('demoVideo');
          return JSON.stringify({
            title: 'Vayu AI Cloud Platform Demo — Tata Communications',
            duration_seconds: 225,
            current_time: Math.floor(video?.currentTime || 0),
            chapters: Object.entries(CONTENT_MAP.video).map(([ts, d]) => ({
              timestamp: parseInt(ts), ...d
            }))
          });
        }
        return JSON.stringify({
          title: 'Voice-Guided Demo',
          available_routes: ['/voice-demo/brochure', '/voice-demo/video']
        });
      }

    };
  });

  // Listen for mode changes (speaking/listening)
  widget.addEventListener('elevenlabs-convai:modality', (event) => {
    const mode = event.detail?.mode;
    setMicState(mode === 'listening');
  });

  document.getElementById('connectionStatus').textContent = 'Widget ready';
  document.getElementById('connectionStatus').style.color = 'var(--amy-green)';
  console.log('[Amy Demo] Client tools listener registered — tools will activate on call start');
}

// ═══════════════════════════════════════════════════════════════
// DRAG-AND-DROP + FILE INPUT HANDLERS
// ═══════════════════════════════════════════════════════════════

function setupDropZone(zoneId, inputId, handler) {
  const zone = document.getElementById(zoneId);
  const input = document.getElementById(inputId);

  zone.addEventListener('click', () => input.click());
  input.addEventListener('change', (e) => {
    if (e.target.files[0]) handler(e.target.files[0]);
  });

  zone.addEventListener('dragover', (e) => {
    e.preventDefault();
    zone.classList.add('dragover');
  });
  zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
  zone.addEventListener('drop', (e) => {
    e.preventDefault();
    zone.classList.remove('dragover');
    if (e.dataTransfer.files[0]) handler(e.dataTransfer.files[0]);
  });
}

// ═══════════════════════════════════════════════════════════════
// AUTO-LOAD: PDF from URL/path
// ═══════════════════════════════════════════════════════════════

async function autoLoadPdfFromUrl(url) {
  try {
    updateStatus('Loading PDF...', true);
    const response = await fetch(url);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const arrayBuffer = await response.arrayBuffer();
    
    pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

    document.getElementById('pdfDropZone').style.display = 'none';
    document.getElementById('pdfContainer').style.display = 'flex';
    document.getElementById('pdfThumbs').style.display = 'flex';
    document.getElementById('pdfInfo').textContent = `${pdfDoc.numPages} pages · Lumen × Meter eBook`;

    const container = document.getElementById('pdfContainer');
    container.innerHTML = '';
    pdfPages = [];

    for (let i = 1; i <= pdfDoc.numPages; i++) {
      const page = await pdfDoc.getPage(i);
      const scale = 1.5;
      const viewport = page.getViewport({ scale });

      const label = document.createElement('div');
      label.className = 'pdf-page-label';
      label.textContent = CONTENT_MAP.pdf[i]?.label || `Page ${i}`;

      const wrap = document.createElement('div');
      wrap.className = 'pdf-canvas-wrap';
      wrap.id = `pdf-page-${i}`;
      wrap.dataset.page = i;

      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      canvas.style.width = '100%';
      canvas.style.height = 'auto';

      wrap.appendChild(canvas);
      container.appendChild(label);
      container.appendChild(wrap);
      pdfPages.push(wrap);

      const ctx = canvas.getContext('2d');
      await page.render({ canvasContext: ctx, viewport }).promise;
    }

    await renderPdfThumbnails();
    updateStatus('PDF loaded — ready to navigate', true);
    setTimeout(() => updateStatus('Ready — speak to navigate', false), 2000);
    console.log(`[Demo] PDF auto-loaded: ${pdfDoc.numPages} pages`);
    return true;
  } catch (err) {
    console.warn('[Demo] PDF auto-load failed, showing drop zone:', err.message);
    updateStatus('Drop a PDF to get started', false);
    return false;
  }
}

// ═══════════════════════════════════════════════════════════════
// AUTO-LOAD: Video from URL/path
// ═══════════════════════════════════════════════════════════════

function autoLoadVideoFromUrl(url) {
  return new Promise((resolve) => {
    const video = document.getElementById('demoVideo');
    
    video.addEventListener('loadedmetadata', () => {
      document.getElementById('videoDropZone').style.display = 'none';
      document.getElementById('videoContainer').style.display = 'flex';
      document.getElementById('videoChapters').style.display = 'flex';
      document.getElementById('videoInfo').textContent = 
        `Demo Video · ${formatTime(video.duration)}`;
      renderVideoChapters();
      console.log(`[Demo] Video auto-loaded: ${formatTime(video.duration)}`);
      resolve(true);
    }, { once: true });

    video.addEventListener('error', () => {
      console.warn('[Demo] Video auto-load failed, showing drop zone');
      resolve(false);
    }, { once: true });

    video.addEventListener('timeupdate', () => {
      updateActiveChapter(video.currentTime);
    });

    video.src = url;
    video.load();
  });
}

// ═══════════════════════════════════════════════════════════════
// KEYBOARD SHORTCUTS (for dev testing without voice)
// ═══════════════════════════════════════════════════════════════

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' && pdfDoc) navigatePdf(Math.min(currentPdfPage + 1, pdfDoc.numPages));
  if (e.key === 'ArrowLeft' && pdfDoc) navigatePdf(Math.max(currentPdfPage - 1, 1));
  if (e.key >= '1' && e.key <= '9' && videoChaptersList.length) {
    const idx = parseInt(e.key) - 1;
    if (videoChaptersList[idx]) navigateVideo(videoChaptersList[idx].timestamp);
  }
});

const PDF_PATH  = './assets/lumen-meter-ebook.pdf';
const VIDEO_PATH = './assets/tata-vayu-cloud-demo.mp4';

async function init() {
  // 1. Try auto-loading PDF
  const pdfLoaded = await autoLoadPdfFromUrl(PDF_PATH);
  if (!pdfLoaded) {
    setupDropZone('pdfDropZone', 'pdfFileInput', loadPDF);
  }

  // 2. Try auto-loading video
  const videoLoaded = await autoLoadVideoFromUrl(VIDEO_PATH);
  if (!videoLoaded) {
    setupDropZone('videoDropZone', 'videoFileInput', loadVideo);
  }

  // 3. Register ElevenLabs client tools
  setTimeout(registerClientTools, 2000);
}

init();
